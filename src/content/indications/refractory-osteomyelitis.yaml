description:
  en: "Chronic osteomyelitis unresponsive to conventional therapy. HBOT enhances leukocyte killing, promotes angiogenesis in avascular bone."
  el: "Χρόνια οστεομυελίτιδα μη ανταποκρινόμενη σε συμβατική θεραπεία. Η HBOT ενισχύει λευκοκυτταρική θανάτωση, προάγει αγγειογένεση σε αναίμακτο οστό."
  de: "Chronische Osteomyelitis, die auf konventionelle Therapie nicht anspricht. HBOT verstärkt die Leukozyten-Abtötung und fördert die Angiogenese in avaskulärem Knochen."
  it: "Osteomielite cronica non responsiva alla terapia convenzionale. L'HBOT potenzia l'attività battericida dei leucociti e favorisce l'angiogenesi nell'osso avascolare."
  es: "Osteomielitis crónica que no responde a la terapia convencional. La HBOT potencia la actividad bactericida de los leucocitos y favorece la angiogénesis en el hueso avascular."

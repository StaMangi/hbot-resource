answerBox:
  en: "In aesthetic and reconstructive surgery, hyperbaric oxygen is used adjunctively to support recovery — accelerating post-procedure healing and helping salvage grafts or flaps with compromised blood supply. The rationale draws on HBOT's established tissue-oxygenating and graft-salvage effects; in the cosmetic setting specifically it remains an adjunctive, investigational use."
  el: "Στην αισθητική και επανορθωτική χειρουργική, η υπερβαρική οξυγονοθεραπεία χρησιμοποιείται επικουρικά για την υποστήριξη της αποκατάστασης — επιταχύνοντας τη μετεγχειρητική επούλωση και βοηθώντας στη διάσωση μοσχευμάτων ή κρημνών με διακυβευμένη αιμάτωση. Το σκεπτικό αντλεί από τις καθιερωμένες ιστο-οξυγονωτικές και διασωστικές δράσεις της HBOT· στο αμιγώς αισθητικό περιβάλλον παραμένει επικουρική, ερευνητική χρήση."
  de: "In der ästhetischen und rekonstruktiven Chirurgie wird hyperbarer Sauerstoff adjuvant zur Unterstützung der Erholung eingesetzt — er beschleunigt die postoperative Heilung und hilft, Transplantate oder Lappen mit kompromittierter Durchblutung zu retten. Die Begründung stützt sich auf die etablierten gewebeoxygenierenden und Rettungs-Wirkungen der HBOT; im rein kosmetischen Kontext bleibt sie eine adjuvante, in Erprobung befindliche Anwendung."
  it: "Nella chirurgia estetica e ricostruttiva, l'ossigeno iperbarico è usato in modo adiuvante a supporto del recupero — accelerando la guarigione post-procedurale e contribuendo a salvare innesti o lembi con apporto sanguigno compromesso. Il razionale attinge alle proprietà ossigenanti e di salvataggio degli innesti consolidate per la HBOT; in ambito strettamente estetico rimane un uso adiuvante e sperimentale."
  es: "En cirugía estética y reconstructiva, el oxígeno hiperbárico se utiliza de forma adyuvante para apoyar la recuperación — acelerando la cicatrización posprocedimiento y ayudando a rescatar injertos o colgajos con riego sanguíneo comprometido. La justificación se apoya en los efectos consolidados de oxigenación tisular y rescate de injertos de la HBOT; en el ámbito puramente cosmético sigue siendo un uso adyuvante e investigacional."

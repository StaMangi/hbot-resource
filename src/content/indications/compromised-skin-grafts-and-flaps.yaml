  it: "Terapia di salvataggio per innesti e lembi cutanei ischemici. Riduce la necrosi ipossica e favorisce la sopravvivenza dell'innesto attraverso una migliore ossigenazione."
  es: "Terapia de salvataje para injertos y colgajos cutáneos isquémicos. Reduce la necrosis hipóxica y favorece la supervivencia del injerto mediante una mayor oxigenación."

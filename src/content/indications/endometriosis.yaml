description:
  en: "Endometriosis is an emerging investigational application of HBOT. Translational evidence in rodent models supports an anti-inflammatory effect on endometriotic lesions: a 2011 rat study reported lesion remission with HBOT, and a 2022 mouse-model study reported reduction of inflammatory markers. Clinical evidence in humans is awaited — the HEROES randomised trial (Sunnybrook Health Sciences Centre, NCT06579040, recruiting since April 2025) is currently underway to evaluate HBOT for endometriosis-related pain. HBOT is positioned as an investigational adjunct, not standard of care."
  el: "Η ενδομητρίωση είναι αναδυόμενη ερευνητική εφαρμογή της HBOT. Μεταγωγικά στοιχεία σε μοντέλα τρωκτικών υποστηρίζουν αντιφλεγμονώδη επίδραση στις ενδομητριωσικές βλάβες: μελέτη του 2011 σε αρουραίους ανέφερε ύφεση των βλαβών με HBOT, και μελέτη του 2022 σε ποντίκια ανέφερε μείωση φλεγμονωδών δεικτών. Τα κλινικά στοιχεία σε ανθρώπους εκκρεμούν — η τυχαιοποιημένη δοκιμή HEROES (Sunnybrook Health Sciences Centre, NCT06579040, εγγραφή ασθενών από τον Απρίλιο του 2025) βρίσκεται σε εξέλιξη για την αξιολόγηση της HBOT για τον πόνο σχετιζόμενο με ενδομητρίωση. Η HBOT τοποθετείται ως ερευνητική επικουρική, όχι ως πρότυπο θεραπείας."
  de: "Endometriose ist eine aufkommende experimentelle Anwendung von HBOT. Translationale Evidenz in Nagetiermodellen stützt einen entzündungshemmenden Effekt auf endometriotische Läsionen: eine Rattenstudie von 2011 berichtete eine Läsionsremission mit HBOT, und eine Mausmodellstudie von 2022 berichtete eine Reduktion von Entzündungsmarkern. Klinische Evidenz am Menschen steht aus — die randomisierte HEROES-Studie (Sunnybrook Health Sciences Centre, NCT06579040, rekrutierend seit April 2025) läuft derzeit zur Bewertung von HBOT bei endometriose-assoziiertem Schmerz. HBOT wird als experimentelle Zusatztherapie positioniert, nicht als Standardtherapie."
  it: "L'endometriosi è un'applicazione sperimentale emergente dell'HBOT. Le evidenze traslazionali nei modelli animali roditori supportano un effetto antinfiammatorio sulle lesioni endometriosiche: uno studio su modello murino (ratto) del 2011 ha riportato la remissione delle lesioni con l'HBOT, e uno studio su modello murino (topo) del 2022 ha riportato una riduzione dei marcatori infiammatori. Si attendono evidenze cliniche sull'uomo — lo studio randomizzato HEROES (Sunnybrook Health Sciences Centre, NCT06579040, in reclutamento da aprile 2025) è attualmente in corso per valutare l'HBOT nel dolore associato all'endometriosi. L'HBOT è posizionata come adiuvante sperimentale, non come standard di cura."
  es: "La endometriosis es una aplicación experimental emergente de la HBOT. La evidencia traslacional en modelos de roedores respalda un efecto antiinflamatorio sobre las lesiones endometriósicas: un estudio en ratas de 2011 informó la remisión de las lesiones con HBOT, y un estudio en modelo de ratón de 2022 informó una reducción de los marcadores inflamatorios. Se esperan evidencias clínicas en humanos — el ensayo aleatorizado HEROES (Sunnybrook Health Sciences Centre, NCT06579040, en reclutamiento desde abril de 2025) se encuentra actualmente en curso para evaluar la HBOT en el dolor asociado a la endometriosis. La HBOT se posiciona como adyuvante experimental, no como estándar de atención."

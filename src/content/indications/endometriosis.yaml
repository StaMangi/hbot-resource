answerBox:
  en: "Endometriosis is an early, investigational HBOT application. Current support comes from translational studies in rodent models, where HBOT influenced the inflammatory and tissue processes implicated in the disease. Clinical evidence in humans is awaited, so this remains a research-stage use only — not a current treatment option."
  el: "Η ενδομητρίωση είναι πρώιμη, ερευνητική εφαρμογή της HBOT. Η τρέχουσα στήριξη προέρχεται από μεταφραστικές μελέτες σε ζωικά μοντέλα τρωκτικών, όπου η HBOT επηρέασε τις φλεγμονώδεις και ιστικές διεργασίες που εμπλέκονται στη νόσο. Η κλινική τεκμηρίωση σε ανθρώπους αναμένεται, οπότε αυτή παραμένει χρήση μόνο ερευνητικού σταδίου — όχι τρέχουσα θεραπευτική επιλογή."
  de: "Die Endometriose ist eine frühe, in Erprobung befindliche HBOT-Anwendung. Die aktuelle Unterstützung kommt aus translationalen Studien an Nagermodellen, in denen HBOT die entzündlichen und Gewebeprozesse beeinflusste, die an der Erkrankung beteiligt sind. Klinische Evidenz beim Menschen steht aus; daher bleibt dies eine ausschließlich forschungsstufige Anwendung — keine aktuelle Therapieoption."
  it: "L'endometriosi è una applicazione HBOT precoce e sperimentale. Il sostegno attuale proviene da studi traslazionali su modelli murini di roditore, in cui l'HBOT ha influenzato i processi infiammatori e tissutali coinvolti nella malattia. L'evidenza clinica nell'uomo è attesa, quindi questo rimane un uso esclusivamente in fase di ricerca — non un'opzione terapeutica attuale."
  es: "La endometriosis es una aplicación temprana e investigacional de la HBOT. El sustento actual procede de estudios traslacionales en modelos murinos de roedor, en los que la HBOT influyó en los procesos inflamatorios y tisulares implicados en la enfermedad. La evidencia clínica en humanos está pendiente, por lo que este uso se mantiene únicamente en fase de investigación — no es una opción terapéutica actual."

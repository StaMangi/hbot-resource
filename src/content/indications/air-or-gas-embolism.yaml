answerBox:
  en: "Air or gas embolism occurs when gas bubbles enter the bloodstream and obstruct arterial flow, often during diving, surgery, or catheter procedures. Hyperbaric oxygen therapy is an FDA-approved primary treatment: increased pressure shrinks the bubbles while 100% oxygen speeds nitrogen washout, restoring circulation to oxygen-deprived tissue."
  el: "Η αερώδης ή αεριώδης εμβολή προκαλείται όταν φυσαλίδες αερίου εισέρχονται στην κυκλοφορία και φράζουν την αρτηριακή ροή, συχνά κατά την κατάδυση, τη χειρουργική επέμβαση ή σε επεμβάσεις καθετηριασμού. Η υπερβαρική οξυγονοθεραπεία αποτελεί εγκεκριμένη από το FDA πρωτογενή θεραπεία: η αυξημένη πίεση συρρικνώνει τις φυσαλίδες, ενώ το 100% οξυγόνο επιταχύνει την έκπλυση αζώτου και αποκαθιστά την κυκλοφορία στους ιστούς που στερούνται οξυγόνο."
  de: "Eine Luft- oder Gasembolie tritt auf, wenn Gasblasen in den Blutkreislauf gelangen und den arteriellen Blutfluss verlegen — häufig beim Tauchen, bei Operationen oder bei Kathetereingriffen. Die hyperbare Sauerstofftherapie ist eine FDA-zugelassene Erstlinienbehandlung: Der erhöhte Druck verkleinert die Blasen, während 100 % Sauerstoff die Stickstoff-Auswaschung beschleunigt und die Durchblutung im sauerstoffarmen Gewebe wiederherstellt."
  it: "L'embolia da aria o da gas si verifica quando bolle di gas entrano nel circolo sanguigno e ostruiscono il flusso arterioso, spesso durante immersioni, interventi chirurgici o procedure con catetere. L'ossigenoterapia iperbarica è un trattamento primario approvato dalla FDA: l'aumento di pressione riduce le dimensioni delle bolle mentre l'ossigeno al 100% accelera l'eliminazione dell'azoto, ripristinando la circolazione nei tessuti privati di ossigeno."
  es: "La embolia aérea o gaseosa se produce cuando burbujas de gas entran en el torrente sanguíneo y obstruyen el flujo arterial, a menudo durante el buceo, una intervención quirúrgica o procedimientos con catéter. La oxigenoterapia hiperbárica es un tratamiento primario aprobado por la FDA: la presión aumentada reduce el tamaño de las burbujas, mientras que el oxígeno al 100% acelera la eliminación del nitrógeno y restablece la circulación en los tejidos privados de oxígeno."
metaDescription:
  en: "FDA-approved primary treatment for air or gas embolism: hyperbaric oxygen shrinks intravascular bubbles and restores oxygen to obstructed tissue."
  el: "Εγκεκριμένη από το FDA πρωτογενής θεραπεία για αερώδη/αεριώδη εμβολή: η υπερβαρική οξυγονοθεραπεία συρρικνώνει τις ενδαγγειακές φυσαλίδες και αποκαθιστά το οξυγόνο στους ιστούς."
  de: "FDA-zugelassene Erstlinienbehandlung der Luft- oder Gasembolie: Die hyperbare Sauerstofftherapie verkleinert intravasale Blasen und versorgt verschlossenes Gewebe wieder mit Sauerstoff."
  it: "Trattamento primario approvato dalla FDA per l'embolia da aria o da gas: l'ossigenoterapia iperbarica riduce le bolle intravascolari e ripristina l'ossigeno ai tessuti ostruiti."
  es: "Tratamiento primario aprobado por la FDA para la embolia aérea o gaseosa: la oxigenoterapia hiperbárica reduce las burbujas intravasculares y restablece el oxígeno en los tejidos obstruidos."

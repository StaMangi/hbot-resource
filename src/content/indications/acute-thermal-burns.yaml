answerBox:
  en: "Severe thermal burns can deepen over the first days as swelling cuts blood flow to damaged tissue. HBOT is a UHMS-approved adjunct to specialist burn care, and FDA-cleared for severe burns treated at a burn centre, but the trial evidence is limited and inconsistent: reviews describe it as promising but not conclusive. Medicare does not cover it."
  el: "Τα σοβαρά θερμικά εγκαύματα μπορεί να βαθύνουν τις πρώτες ημέρες, καθώς το οίδημα περιορίζει την αιματική ροή στον κατεστραμμένο ιστό. Η HBOT είναι εγκεκριμένη από την UHMS ως επικουρική θεραπεία στην εξειδικευμένη φροντίδα εγκαυμάτων και εγκεκριμένη από το FDA για σοβαρά εγκαύματα σε κέντρο εγκαυμάτων, αλλά τα στοιχεία από δοκιμές είναι περιορισμένα και ασυνεπή: οι ανασκοπήσεις τη χαρακτηρίζουν υποσχόμενη αλλά όχι αποδεδειγμένη. Το Medicare δεν την καλύπτει."
  de: "Schwere thermische Verbrennungen können sich in den ersten Tagen vertiefen, wenn Schwellungen die Durchblutung des geschädigten Gewebes drosseln. HBOT ist eine von der UHMS anerkannte Begleittherapie zur spezialisierten Verbrennungsbehandlung und von der FDA für schwere Verbrennungen in einem Verbrennungszentrum freigegeben, doch die Studienlage ist begrenzt und uneinheitlich: Reviews bezeichnen sie als vielversprechend, aber nicht belegt. Medicare übernimmt sie nicht."
  it: "Le ustioni termiche gravi possono approfondirsi nei primi giorni perché l'edema riduce il flusso sanguigno al tessuto danneggiato. L'HBOT è un adiuvante approvato dalla UHMS alle cure specialistiche per le ustioni e autorizzato dalla FDA per ustioni gravi trattate in un centro ustioni, ma le evidenze degli studi sono limitate e incoerenti: le revisioni la descrivono come promettente ma non conclusiva. Medicare non la copre."
  es: "Las quemaduras térmicas graves pueden profundizarse durante los primeros días, cuando el edema reduce el flujo sanguíneo al tejido dañado. La HBOT es un tratamiento adyuvante aprobado por la UHMS en la atención especializada de quemados y autorizado por la FDA para quemaduras graves tratadas en una unidad de quemados, pero la evidencia de los ensayos es limitada e inconsistente: las revisiones la describen como prometedora pero no concluyente. Medicare no la cubre."
  fr: "Les brûlures thermiques graves peuvent s'approfondir au cours des premiers jours, lorsque l'œdème réduit le débit sanguin vers les tissus lésés. L'HBOT est un traitement adjuvant approuvé par l'UHMS dans la prise en charge spécialisée des brûlés, et autorisé par la FDA pour les brûlures graves traitées dans un centre de brûlés, mais les données des essais sont limitées et incohérentes : les revues la décrivent comme prometteuse mais non concluante. Medicare ne la prend pas en charge."

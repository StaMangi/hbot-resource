  el: "HBOT για οξέα θερμικά εγκαύματα: επικουρική θεραπεία εγκεκριμένη από UHMS και FDA στα κέντρα εγκαυμάτων, με περιορισμένα και ασυνεπή στοιχεία. Τι δείχνουν οι ανασκοπήσεις."
  de: "HBOT bei akuten thermischen Verbrennungen: UHMS-anerkannte, FDA-freigegebene Begleittherapie im Verbrennungszentrum mit begrenzter, uneinheitlicher Studienlage."
  it: "HBOT per le ustioni termiche acute: adiuvante approvato da UHMS e FDA nei centri ustioni, con evidenze limitate e incoerenti. Cosa mostrano le revisioni."
  es: "HBOT para quemaduras térmicas agudas: adyuvante aprobado por la UHMS y autorizado por la FDA en unidades de quemados, con evidencia limitada e inconsistente."

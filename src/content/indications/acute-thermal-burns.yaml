  en: "Acute Thermal Burns"
  el: "Οξέα Θερμικά Εγκαύματα"
  de: "Akute thermische Verbrennungen"
  it: "Ustioni termiche acute"
  es: "Quemaduras térmicas agudas"
  fr: "Brûlures thermiques aiguës"
description:
  en: "Severe thermal burns destroy skin and trigger swelling and reduced blood flow in the surrounding tissue, which can deepen the injury over the first days. Hyperbaric oxygen has been used as an adjunct to specialist burn care to limit this progression, reduce oedema and support healing. Acute thermal burn injury is on the UHMS list of approved indications, and the FDA has cleared hyperbaric chambers for severe and large burns treated at a specialised burn centre.\n\nThe clinical evidence is limited. A Cochrane review found two eligible randomised trials, both of poor methodological quality: one reported no difference in length of stay, mortality or number of operations, the other a shorter healing time (a mean of 19.7 versus 43.8 days). The reviewers concluded that there is not sufficient evidence to support or refute HBOT for thermal burns (Villanueva 2004). A 2026 systematic review of 13 studies (566 patients) concluded that HBOT shows promise as an adjunct, improving healing and reducing complications, but that variable and inconsistent outcomes limit definitive conclusions (Molina-Vega 2026).\n\nUS Medicare does not cover HBOT for thermal skin burns. Treatment protocols vary between burn centres and have not been standardised in trials."
  el: "Τα σοβαρά θερμικά εγκαύματα καταστρέφουν το δέρμα και προκαλούν οίδημα και μειωμένη αιματική ροή στους γύρω ιστούς, γεγονός που μπορεί να βαθύνει τη βλάβη τις πρώτες ημέρες. Το υπερβαρικό οξυγόνο έχει χρησιμοποιηθεί επικουρικά στην εξειδικευμένη φροντίδα εγκαυμάτων για να περιορίσει αυτή την εξέλιξη, να μειώσει το οίδημα και να υποστηρίξει την επούλωση. Το οξύ θερμικό έγκαυμα περιλαμβάνεται στη λίστα εγκεκριμένων ενδείξεων της UHMS, και το FDA έχει εγκρίνει τους υπερβαρικούς θαλάμους για σοβαρά και εκτεταμένα εγκαύματα που αντιμετωπίζονται σε εξειδικευμένο κέντρο εγκαυμάτων.\n\nΤα κλινικά στοιχεία είναι περιορισμένα. Μια ανασκόπηση Cochrane βρήκε δύο επιλέξιμες τυχαιοποιημένες δοκιμές, αμφότερες χαμηλής μεθοδολογικής ποιότητας: η μία δεν ανέφερε διαφορά στη διάρκεια νοσηλείας, τη θνησιμότητα ή τον αριθμό επεμβάσεων, ενώ η άλλη ανέφερε ταχύτερη επούλωση (κατά μέσο όρο 19,7 έναντι 43,8 ημερών). Οι συγγραφείς κατέληξαν ότι δεν υπάρχουν επαρκή στοιχεία ούτε υπέρ ούτε κατά της HBOT στα θερμικά εγκαύματα (Villanueva 2004). Μια συστηματική ανασκόπηση του 2026 με 13 μελέτες (566 ασθενείς) κατέληξε ότι η HBOT είναι υποσχόμενη ως επικουρική θεραπεία, βελτιώνοντας την επούλωση και μειώνοντας τις επιπλοκές, αλλά ότι τα μεταβλητά και ασυνεπή αποτελέσματα δεν επιτρέπουν οριστικά συμπεράσματα (Molina-Vega 2026).\n\nΤο αμερικανικό Medicare δεν καλύπτει την HBOT για θερμικά εγκαύματα του δέρματος. Τα θεραπευτικά πρωτόκολλα διαφέρουν μεταξύ κέντρων εγκαυμάτων και δεν έχουν τυποποιηθεί σε δοκιμές."
  de: "Schwere thermische Verbrennungen zerstören die Haut und lösen im umgebenden Gewebe Schwellung und verminderte Durchblutung aus, wodurch sich die Verletzung in den ersten Tagen vertiefen kann. Hyperbarer Sauerstoff wird begleitend zur spezialisierten Verbrennungsbehandlung eingesetzt, um dieses Fortschreiten zu begrenzen, Ödeme zu verringern und die Heilung zu unterstützen. Die akute thermische Verbrennung steht auf der Liste der von der UHMS anerkannten Indikationen, und die FDA hat Überdruckkammern für schwere und großflächige Verbrennungen freigegeben, die in einem spezialisierten Verbrennungszentrum behandelt werden.\n\nDie klinische Evidenz ist begrenzt. Ein Cochrane-Review fand zwei geeignete randomisierte Studien, beide von geringer methodischer Qualität: Eine berichtete keinen Unterschied bei Liegedauer, Mortalität oder Zahl der Operationen, die andere eine kürzere Heilungsdauer (im Mittel 19,7 gegenüber 43,8 Tagen). Die Autoren kamen zu dem Schluss, dass die Evidenz nicht ausreicht, um HBOT bei thermischen Verbrennungen zu stützen oder zu widerlegen (Villanueva 2004). Ein systematischer Review von 2026 mit 13 Studien (566 Patienten) kam zu dem Schluss, dass HBOT als Begleittherapie vielversprechend ist, die Heilung verbessert und Komplikationen verringert, dass aber variable und uneinheitliche Ergebnisse endgültige Schlüsse nicht zulassen (Molina-Vega 2026).\n\nDas US-amerikanische Medicare übernimmt HBOT bei thermischen Hautverbrennungen nicht. Die Behandlungsprotokolle unterscheiden sich zwischen Verbrennungszentren und wurden in Studien nicht standardisiert."
  it: "Le ustioni termiche gravi distruggono la cute e provocano edema e riduzione del flusso sanguigno nei tessuti circostanti, che possono approfondire la lesione nei primi giorni. L'ossigeno iperbarico è stato impiegato come adiuvante alle cure specialistiche per le ustioni per limitare questa progressione, ridurre l'edema e favorire la guarigione. L'ustione termica acuta figura nell'elenco delle indicazioni approvate dalla UHMS, e la FDA ha autorizzato le camere iperbariche per ustioni gravi ed estese trattate in un centro ustioni specializzato.\n\nLe evidenze cliniche sono limitate. Una revisione Cochrane ha individuato due studi randomizzati idonei, entrambi di scarsa qualità metodologica: uno non ha riportato differenze nella durata della degenza, nella mortalità o nel numero di interventi, l'altro un tempo di guarigione più breve (in media 19,7 contro 43,8 giorni). Gli autori hanno concluso che non vi sono evidenze sufficienti per sostenere o confutare l'HBOT nelle ustioni termiche (Villanueva 2004). Una revisione sistematica del 2026 su 13 studi (566 pazienti) ha concluso che l'HBOT è promettente come adiuvante, migliorando la guarigione e riducendo le complicanze, ma che esiti variabili e incoerenti non consentono conclusioni definitive (Molina-Vega 2026).\n\nNegli Stati Uniti Medicare non copre l'HBOT per le ustioni termiche della cute. I protocolli di trattamento variano tra i centri ustioni e non sono stati standardizzati negli studi."
  es: "Las quemaduras térmicas graves destruyen la piel y provocan edema y disminución del flujo sanguíneo en el tejido circundante, lo que puede profundizar la lesión durante los primeros días. El oxígeno hiperbárico se ha utilizado como complemento de la atención especializada de quemados para limitar esta progresión, reducir el edema y favorecer la cicatrización. La quemadura térmica aguda figura en la lista de indicaciones aprobadas por la UHMS, y la FDA ha autorizado las cámaras hiperbáricas para quemaduras graves y extensas tratadas en una unidad de quemados especializada.\n\nLa evidencia clínica es limitada. Una revisión Cochrane encontró dos ensayos aleatorizados elegibles, ambos de baja calidad metodológica: uno no halló diferencias en la estancia hospitalaria, la mortalidad ni el número de intervenciones, y el otro notificó un tiempo de cicatrización más corto (una media de 19,7 frente a 43,8 días). Los autores concluyeron que no hay evidencia suficiente para respaldar ni refutar la HBOT en las quemaduras térmicas (Villanueva 2004). Una revisión sistemática de 2026 de 13 estudios (566 pacientes) concluyó que la HBOT resulta prometedora como tratamiento adyuvante, al mejorar la cicatrización y reducir las complicaciones, pero que la variabilidad y la inconsistencia de los resultados impiden extraer conclusiones definitivas (Molina-Vega 2026).\n\nEn Estados Unidos, Medicare no cubre la HBOT para las quemaduras térmicas de la piel. Los protocolos de tratamiento varían entre unidades de quemados y no se han estandarizado en ensayos."
  fr: "Les brûlures thermiques graves détruisent la peau et provoquent un œdème et une diminution du débit sanguin dans les tissus environnants, ce qui peut approfondir la lésion au cours des premiers jours. L'oxygène hyperbare est utilisé en complément de la prise en charge spécialisée des brûlés pour limiter cette progression, réduire l'œdème et favoriser la cicatrisation. La brûlure thermique aiguë figure sur la liste des indications approuvées par l'UHMS, et la FDA a autorisé les caissons hyperbares pour les brûlures graves et étendues traitées dans un centre spécialisé de traitement des brûlés.\n\nLes données cliniques sont limitées. Une revue Cochrane a identifié deux essais randomisés éligibles, tous deux de faible qualité méthodologique : l'un n'a rapporté aucune différence de durée d'hospitalisation, de mortalité ou de nombre d'interventions, l'autre une durée de cicatrisation plus courte (en moyenne 19,7 contre 43,8 jours). Les auteurs de la revue ont conclu que les données sont insuffisantes pour étayer ou réfuter l'HBOT dans les brûlures thermiques (Villanueva 2004). Une revue systématique de 2026 portant sur 13 études (566 patients) a conclu que l'HBOT est prometteuse comme traitement adjuvant, en améliorant la cicatrisation et en réduisant les complications, mais que des résultats variables et incohérents ne permettent pas de conclusions définitives (Molina-Vega 2026).\n\nAux États-Unis, Medicare ne prend pas en charge l'HBOT pour les brûlures thermiques cutanées. Les protocoles de traitement varient d'un centre de traitement des brûlés à l'autre et n'ont pas été standardisés dans des essais."

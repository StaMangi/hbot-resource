description:
  en: "When transfusion is not possible due to religious beliefs or unavailability, HBOT provides sufficient dissolved plasma oxygen to sustain life."
  el: "Όταν η μετάγγιση δεν είναι δυνατή λόγω θρησκευτικών πεποιθήσεων ή έλλειψης, η HBOT παρέχει επαρκές διαλυμένο οξυγόνο πλάσματος για διατήρηση ζωής."
  de: "Wenn eine Transfusion aufgrund religiöser Überzeugungen oder fehlender Verfügbarkeit nicht möglich ist, liefert HBOT ausreichend gelösten Plasmasauerstoff, um das Leben zu erhalten."
  it: "Quando la trasfusione non è possibile per convinzioni religiose o per indisponibilità, l'HBOT fornisce ossigeno plasmatico disciolto sufficiente a sostenere la vita."
  es: "Cuando la transfusión no es posible por convicciones religiosas o por indisponibilidad, la HBOT aporta suficiente oxígeno plasmático disuelto para sostener la vida."

answerBox:
  en: "HBOT for persistent post-concussion syndrome after mild traumatic brain injury is genuinely contested. Two randomised trials from one research group reported cognitive and quality-of-life gains, while an independent sham-controlled trial in military personnel found no benefit over sham. Experts disagree on whether pressurised-air shams are truly inactive. Investigational; not FDA-approved."
  el: "Η HBOT για το επίμονο μετα-διασειστικό σύνδρομο μετά από ήπια κρανιοεγκεφαλική κάκωση είναι πραγματικά αμφιλεγόμενη. Δύο τυχαιοποιημένες δοκιμές από μία ερευνητική ομάδα ανέφεραν βελτίωση της γνωστικής λειτουργίας και της ποιότητας ζωής, ενώ μια ανεξάρτητη εικονικά ελεγχόμενη δοκιμή σε στρατιωτικό προσωπικό δεν βρήκε όφελος έναντι της εικονικής θεραπείας. Οι ειδικοί διαφωνούν για το αν οι εικονικές θεραπείες πεπιεσμένου αέρα είναι πράγματι ανενεργές. Ερευνητική· δεν είναι εγκεκριμένη από το FDA."
  de: "HBOT beim anhaltenden Postkommotionssyndrom nach leichtem Schädel-Hirn-Trauma ist ernsthaft umstritten. Zwei randomisierte Studien einer Forschungsgruppe berichteten über Verbesserungen von Kognition und Lebensqualität, während eine unabhängige scheinkontrollierte Studie an Militärangehörigen keinen Nutzen gegenüber der Scheinbehandlung fand. Fachleute sind uneins, ob Druckluft-Scheinbehandlungen tatsächlich unwirksam sind. Experimentell; nicht von der FDA zugelassen."
  it: "L'HBOT per la sindrome post-commotiva persistente dopo un trauma cranico lieve è genuinamente controversa. Due studi randomizzati di un unico gruppo di ricerca hanno riportato miglioramenti cognitivi e della qualità della vita, mentre uno studio indipendente controllato con sham in personale militare non ha rilevato benefici rispetto allo sham. Gli esperti non concordano sul fatto che gli sham ad aria pressurizzata siano davvero inattivi. Sperimentale; non approvata dalla FDA."
  es: "La HBOT para el síndrome posconmocional persistente tras un traumatismo craneoencefálico leve es realmente controvertida. Dos ensayos aleatorizados de un mismo grupo de investigación notificaron mejoras cognitivas y de la calidad de vida, mientras que un ensayo independiente controlado con simulación en personal militar no halló beneficio frente a la simulación. Los expertos discrepan sobre si las simulaciones con aire presurizado son realmente inactivas. Experimental; no aprobada por la FDA."

condition:
  en: "Traumatic Brain Injury & Post-Concussion Syndrome"
  el: "Κρανιοεγκεφαλική Κάκωση & Μετα-διασειστικό Σύνδρομο"
  de: "Schädel-Hirn-Trauma & Postkommotionelles Syndrom"
  it: "Trauma cranico e sindrome post-commotiva"
  es: "Traumatismo craneoencefálico y síndrome posconmocional"
description:
  en: "After a mild traumatic brain injury (concussion), a minority of patients develop persistent post-concussion syndrome — headache, slowed thinking, memory and attention problems and mood changes that can last for years. HBOT in this chronic phase is one of the most contested questions in hyperbaric medicine, and the trials point in different directions. In favour: a randomised crossover trial in 56 adults 1–5 years after mild TBI (40 sessions of 60 minutes, 100% oxygen at 1.5 ATA) reported significant improvements in cognitive function and quality of life after HBOT but not during a no-treatment control period, with SPECT showing increased brain activity (Boussi-Gross 2013); and a sham-controlled, double-blind trial in 25 children aged 8–15 with persistent post-concussion syndrome (60 sessions of 60 minutes at 1.5 ATA, against a sham at near-surface pressure) reported improvements in cognitive and behavioural function, symptoms and quality of life, with MRI microstructural changes, although recruitment stopped before the planned sample size was reached (Hadanny 2022). Against: a randomised, double-blind, sham-controlled trial in 60 active-duty marines with post-concussion symptoms persisting 3–36 months (40 sessions of 60 minutes) found no immediate benefit of oxygen exposures equivalent to 1.5 or 2.0 ATA over a sham gas mixture equivalent to breathing surface air, and concluded that the results do not support HBOT for cognitive, balance or fine-motor deficits (Walker 2014). Interpretation hinges on the control arms. One review argues that pressurised-air controls (21% oxygen above 1.0 ATA, typically 1.2–1.3 ATA) are themselves therapeutically active, so trials using them are better read as dose comparisons, and grades the evidence as B-level (Figueroa & Wright 2016); a critical appraisal counters that no mechanism has been shown for such low-pressure exposures and that an apparent effect in both arms more likely reflects a participation effect (Bennett 2018). Both positive trials come from a single Israeli research group (Assaf Harofeh, now Shamir Medical Center), and several authors of the 2022 trial declare commercial competing interests. The protocols studied — not a clinical recommendation — comprised 40–60 daily sessions of 60 minutes, 100% oxygen at 1.5 ATA, five days a week. HBOT for TBI and post-concussion syndrome remains investigational and is not FDA-approved."
  el: "Μετά από ήπια κρανιοεγκεφαλική κάκωση (διάσειση), μια μειοψηφία ασθενών αναπτύσσει επίμονο μετα-διασειστικό σύνδρομο — κεφαλαλγία, βραδύτητα σκέψης, προβλήματα μνήμης και προσοχής και μεταβολές της διάθεσης που μπορεί να διαρκέσουν χρόνια. Η HBOT σε αυτή τη χρόνια φάση είναι ένα από τα πιο αμφιλεγόμενα ζητήματα της υπερβαρικής ιατρικής, και οι δοκιμές δείχνουν προς διαφορετικές κατευθύνσεις. Υπέρ: μια τυχαιοποιημένη διασταυρούμενη δοκιμή σε 56 ενήλικες 1–5 έτη μετά από ήπια ΚΕΚ (40 συνεδρίες των 60 λεπτών, 100% οξυγόνο στα 1,5 ATA) ανέφερε σημαντική βελτίωση της γνωστικής λειτουργίας και της ποιότητας ζωής μετά την HBOT αλλά όχι κατά μια περίοδο ελέγχου χωρίς θεραπεία, με το SPECT να δείχνει αυξημένη εγκεφαλική δραστηριότητα (Boussi-Gross 2013)· και μια εικονικά ελεγχόμενη (sham), διπλά τυφλή δοκιμή σε 25 παιδιά 8–15 ετών με επίμονο μετα-διασειστικό σύνδρομο (60 συνεδρίες των 60 λεπτών στα 1,5 ATA, έναντι εικονικής θεραπείας σε πίεση σχεδόν ίση με την ατμοσφαιρική) ανέφερε βελτίωση της γνωστικής και συμπεριφορικής λειτουργίας, των συμπτωμάτων και της ποιότητας ζωής, με μικροδομικές αλλαγές στη μαγνητική τομογραφία, αν και η ένταξη ασθενών διακόπηκε πριν επιτευχθεί το προγραμματισμένο μέγεθος δείγματος (Hadanny 2022). Κατά: μια τυχαιοποιημένη, διπλά τυφλή, εικονικά ελεγχόμενη δοκιμή σε 60 εν ενεργεία πεζοναύτες με μετα-διασειστικά συμπτώματα που επέμεναν 3–36 μήνες (40 συνεδρίες των 60 λεπτών) δεν διαπίστωσε άμεσο όφελος από εκθέσεις σε οξυγόνο ισοδύναμες με 1,5 ή 2,0 ATA έναντι εικονικού μείγματος αερίων ισοδύναμου με την αναπνοή ατμοσφαιρικού αέρα, και κατέληξε ότι τα αποτελέσματα δεν υποστηρίζουν τη χρήση της HBOT για γνωστικά, ισορροπιακά ή λεπτά κινητικά ελλείμματα (Walker 2014). Η ερμηνεία εξαρτάται από τις ομάδες ελέγχου. Μια ανασκόπηση υποστηρίζει ότι οι μάρτυρες πεπιεσμένου αέρα (21% οξυγόνο άνω του 1,0 ATA, συνήθως 1,2–1,3 ATA) είναι οι ίδιοι θεραπευτικά ενεργοί, οπότε οι δοκιμές που τους χρησιμοποιούν διαβάζονται καλύτερα ως συγκρίσεις δόσεων, και βαθμολογεί τα στοιχεία ως επιπέδου B (Figueroa & Wright 2016)· μια κριτική αξιολόγηση αντιτείνει ότι δεν έχει αποδειχθεί μηχανισμός για τέτοιες εκθέσεις χαμηλής πίεσης και ότι ένα φαινομενικό αποτέλεσμα και στις δύο ομάδες αντανακλά πιθανότερα φαινόμενο συμμετοχής (Bennett 2018). Και οι δύο θετικές δοκιμές προέρχονται από μία ισραηλινή ερευνητική ομάδα (Assaf Harofeh, νυν Shamir Medical Center), και αρκετοί συγγραφείς της δοκιμής του 2022 δηλώνουν εμπορικά ανταγωνιστικά συμφέροντα. Τα πρωτόκολλα όπως μελετήθηκαν —όχι κλινική σύσταση— περιελάμβαναν 40–60 καθημερινές συνεδρίες των 60 λεπτών, 100% οξυγόνο στα 1,5 ATA, πέντε ημέρες την εβδομάδα. Η HBOT για την ΚΕΚ και το μετα-διασειστικό σύνδρομο παραμένει ερευνητική και δεν είναι εγκεκριμένη από το FDA."
  de: "Nach einem leichten Schädel-Hirn-Trauma (Gehirnerschütterung) entwickelt eine Minderheit der Patienten ein anhaltendes Postkommotionssyndrom — Kopfschmerzen, verlangsamtes Denken, Gedächtnis- und Aufmerksamkeitsprobleme sowie Stimmungsveränderungen, die jahrelang bestehen können. HBOT in dieser chronischen Phase ist eine der umstrittensten Fragen der Überdruckmedizin, und die Studien weisen in unterschiedliche Richtungen. Dafür: Eine randomisierte Crossover-Studie an 56 Erwachsenen 1–5 Jahre nach leichtem SHT (40 Sitzungen von 60 Minuten, 100% Sauerstoff bei 1,5 ATA) berichtete über signifikante Verbesserungen von Kognition und Lebensqualität nach HBOT, nicht jedoch während einer unbehandelten Kontrollphase, wobei das SPECT eine erhöhte Hirnaktivität zeigte (Boussi-Gross 2013); und eine scheinkontrollierte, doppelblinde Studie an 25 Kindern im Alter von 8–15 Jahren mit persistierendem Postkommotionssyndrom (60 Sitzungen von 60 Minuten bei 1,5 ATA, gegenüber einer Scheinbehandlung bei nahezu Umgebungsdruck) berichtete über Verbesserungen der kognitiven und verhaltensbezogenen Funktion, der Symptome und der Lebensqualität mit mikrostrukturellen MRT-Veränderungen, wobei die Rekrutierung vor Erreichen der geplanten Stichprobengröße beendet wurde (Hadanny 2022). Dagegen: Eine randomisierte, doppelblinde, scheinkontrollierte Studie an 60 aktiven Marineinfanteristen mit seit 3–36 Monaten anhaltenden postkommotionellen Beschwerden (40 Sitzungen von 60 Minuten) fand keinen unmittelbaren Nutzen von Sauerstoffexpositionen entsprechend 1,5 oder 2,0 ATA gegenüber einem Schein-Gasgemisch, das dem Atmen von Umgebungsluft entspricht, und kam zu dem Schluss, dass die Ergebnisse HBOT bei kognitiven, Gleichgewichts- oder feinmotorischen Defiziten nicht stützen (Walker 2014). Die Interpretation hängt an den Kontrollarmen. Ein Review argumentiert, dass Druckluft-Kontrollen (21% Sauerstoff über 1,0 ATA, typischerweise 1,2–1,3 ATA) selbst therapeutisch wirksam sind, sodass Studien mit solchen Kontrollen eher als Dosisvergleiche zu lesen sind, und stuft die Evidenz als B-Level ein (Figueroa & Wright 2016); eine kritische Bewertung hält dagegen, dass für solche Niederdruck-Expositionen kein Wirkmechanismus nachgewiesen ist und ein scheinbarer Effekt in beiden Armen eher einen Teilnahmeeffekt widerspiegelt (Bennett 2018). Beide positiven Studien stammen von einer einzigen israelischen Forschungsgruppe (Assaf Harofeh, heute Shamir Medical Center), und mehrere Autoren der Studie von 2022 geben kommerzielle Interessenkonflikte an. Die untersuchten Protokolle — keine klinische Empfehlung — umfassten 40–60 tägliche Sitzungen von 60 Minuten, 100% Sauerstoff bei 1,5 ATA, fünf Tage pro Woche. HBOT bei SHT und Postkommotionssyndrom bleibt experimentell und ist nicht von der FDA zugelassen."
  it: "Dopo un trauma cranico lieve (commozione cerebrale), una minoranza di pazienti sviluppa una sindrome post-commotiva persistente — cefalea, rallentamento del pensiero, disturbi della memoria e dell'attenzione e alterazioni dell'umore che possono durare anni. L'HBOT in questa fase cronica è una delle questioni più controverse della medicina iperbarica, e gli studi puntano in direzioni diverse. A favore: uno studio randomizzato crossover su 56 adulti a 1–5 anni da un trauma cranico lieve (40 sedute di 60 minuti, ossigeno al 100% a 1,5 ATA) ha riportato miglioramenti significativi della funzione cognitiva e della qualità della vita dopo l'HBOT ma non durante un periodo di controllo senza trattamento, con la SPECT che mostrava un aumento dell'attività cerebrale (Boussi-Gross 2013); e uno studio in doppio cieco controllato con sham su 25 bambini di 8–15 anni con sindrome post-commotiva persistente (60 sedute di 60 minuti a 1,5 ATA, rispetto a uno sham a pressione quasi ambiente) ha riportato miglioramenti della funzione cognitiva e comportamentale, dei sintomi e della qualità della vita, con cambiamenti microstrutturali alla risonanza magnetica, sebbene il reclutamento sia stato interrotto prima di raggiungere la dimensione campionaria prevista (Hadanny 2022). Contro: uno studio randomizzato, in doppio cieco, controllato con sham su 60 marines in servizio attivo con sintomi post-commotivi persistenti da 3–36 mesi (40 sedute di 60 minuti) non ha rilevato alcun beneficio immediato di esposizioni all'ossigeno equivalenti a 1,5 o 2,0 ATA rispetto a una miscela di gas sham equivalente alla respirazione di aria ambiente, concludendo che i risultati non supportano l'HBOT per i deficit cognitivi, dell'equilibrio o della motricità fine (Walker 2014). L'interpretazione dipende dai bracci di controllo. Una revisione sostiene che i controlli ad aria pressurizzata (21% di ossigeno sopra 1,0 ATA, tipicamente 1,2–1,3 ATA) siano essi stessi terapeuticamente attivi, per cui gli studi che li utilizzano vanno letti piuttosto come confronti di dose, e classifica le evidenze come di livello B (Figueroa & Wright 2016); una valutazione critica ribatte che per tali esposizioni a bassa pressione non è stato dimostrato alcun meccanismo e che un effetto apparente in entrambi i bracci riflette più probabilmente un effetto di partecipazione (Bennett 2018). Entrambi gli studi positivi provengono da un unico gruppo di ricerca israeliano (Assaf Harofeh, oggi Shamir Medical Center), e diversi autori dello studio del 2022 dichiarano conflitti di interesse commerciali. I protocolli studiati — non una raccomandazione clinica — prevedevano 40–60 sedute quotidiane di 60 minuti, ossigeno al 100% a 1,5 ATA, cinque giorni alla settimana. L'HBOT per il trauma cranico e la sindrome post-commotiva rimane sperimentale e non è approvata dalla FDA."
  es: "Tras un traumatismo craneoencefálico leve (conmoción cerebral), una minoría de pacientes desarrolla un síndrome posconmocional persistente —cefalea, lentitud de pensamiento, problemas de memoria y atención y cambios del estado de ánimo que pueden durar años—. La HBOT en esta fase crónica es una de las cuestiones más controvertidas de la medicina hiperbárica, y los ensayos apuntan en direcciones distintas. A favor: un ensayo aleatorizado cruzado en 56 adultos de 1–5 años tras un TCE leve (40 sesiones de 60 minutos, oxígeno al 100% a 1,5 ATA) notificó mejoras significativas de la función cognitiva y de la calidad de vida tras la HBOT, pero no durante un periodo de control sin tratamiento, con una SPECT que mostró aumento de la actividad cerebral (Boussi-Gross 2013); y un ensayo doble ciego controlado con simulación (sham) en 25 niños de 8–15 años con síndrome posconmocional persistente (60 sesiones de 60 minutos a 1,5 ATA, frente a una simulación a presión casi ambiente) notificó mejoras de la función cognitiva y conductual, de los síntomas y de la calidad de vida, con cambios microestructurales en la RM, aunque el reclutamiento se detuvo antes de alcanzar el tamaño muestral previsto (Hadanny 2022). En contra: un ensayo aleatorizado, doble ciego y controlado con simulación en 60 marines en servicio activo con síntomas posconmocionales persistentes durante 3–36 meses (40 sesiones de 60 minutos) no halló beneficio inmediato de exposiciones al oxígeno equivalentes a 1,5 o 2,0 ATA frente a una mezcla de gases simulada equivalente a respirar aire ambiente, y concluyó que los resultados no respaldan la HBOT para los déficits cognitivos, del equilibrio o de la motricidad fina (Walker 2014). La interpretación depende de los grupos de control. Una revisión sostiene que los controles de aire presurizado (21% de oxígeno por encima de 1,0 ATA, habitualmente 1,2–1,3 ATA) son en sí mismos terapéuticamente activos, por lo que los ensayos que los utilizan deben leerse más bien como comparaciones de dosis, y califica la evidencia como de nivel B (Figueroa & Wright 2016); una evaluación crítica replica que no se ha demostrado ningún mecanismo para esas exposiciones a baja presión y que un efecto aparente en ambos grupos refleja más probablemente un efecto de participación (Bennett 2018). Ambos ensayos positivos proceden de un único grupo de investigación israelí (Assaf Harofeh, actualmente Shamir Medical Center), y varios autores del ensayo de 2022 declaran conflictos de intereses comerciales. Los protocolos estudiados —no una recomendación clínica— consistieron en 40–60 sesiones diarias de 60 minutos, oxígeno al 100% a 1,5 ATA, cinco días por semana. La HBOT para el TCE y el síndrome posconmocional sigue siendo experimental y no está aprobada por la FDA."

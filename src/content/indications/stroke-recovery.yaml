condition:
  en: "Chronic Post-Stroke Recovery"
  el: "Χρόνια Αποκατάσταση μετά από Εγκεφαλικό"
  de: "Chronische Genesung nach Schlaganfall"
  it: "Recupero cronico post-ictus"
  es: "Recuperación crónica post-ictus"
  fr: "Récupération chronique après un AVC"
description:
  en: "Many stroke survivors retain motor, sensory and cognitive deficits long after the acute event, and gains from conventional rehabilitation typically plateau in the months that follow. HBOT has been studied in this chronic phase as a way to reactivate neuroplasticity in brain regions that remain alive but under-functioning.\n\nA prospective randomised trial enrolled 74 patients 6–36 months after stroke, of whom 59 were analysed (Efrati 2013): one group received 40 HBOT sessions (90 minutes, 100% oxygen at 2 ATA, five days a week), while the other served as a two-month no-treatment control before crossing over to the same HBOT course. Neurological function (NIHSS), activities of daily living and quality of life improved significantly after HBOT but not during the control period, and SPECT showed increased activity mainly in regions that appeared viable on CT yet had low metabolic activity.\n\nAn independent randomised feasibility trial in Toronto, in 27 patients 3–48 months after stroke (Schiavo 2020), found HBOT combined with an upper-limb exercise and mental-imagery programme safe and feasible, with trends toward improved upper-limb motor function; differences between the groups were not statistically significant.\n\nThis chronic-phase evidence should be distinguished from acute stroke: a Cochrane systematic review of 11 randomised trials involving 705 participants found no good evidence that HBOT improves clinical outcomes when applied during the acute presentation of ischaemic stroke, while noting that the possibility of benefit has not been excluded (Bennett 2014).\n\nThe principal chronic-phase trial had no sham control, so participants knew their allocation, and it comes from the same Israeli research group (Assaf Harofeh, now Shamir Medical Center) as the Long COVID, Fibromyalgia and PTSD entries. The protocol as studied — not a clinical recommendation — comprised 40 daily sessions of 90 minutes, 100% oxygen at 2 ATA, five days a week. HBOT for stroke recovery remains investigational and is not FDA-approved."
  el: "Πολλοί επιζώντες εγκεφαλικού διατηρούν κινητικά, αισθητικά και γνωστικά ελλείμματα πολύ μετά το οξύ επεισόδιο, και τα οφέλη της συμβατικής αποκατάστασης συνήθως σταθεροποιούνται μέσα στους επόμενους μήνες. Η HBOT έχει μελετηθεί σε αυτή τη χρόνια φάση ως τρόπος επανενεργοποίησης της νευροπλαστικότητας σε εγκεφαλικές περιοχές που παραμένουν ζωντανές αλλά υπολειτουργούν.\n\nΜια προοπτική τυχαιοποιημένη δοκιμή ενέταξε 74 ασθενείς 6–36 μήνες μετά από εγκεφαλικό, από τους οποίους αναλύθηκαν οι 59 (Efrati 2013): η μία ομάδα έλαβε 40 συνεδρίες HBOT (90 λεπτά, 100% οξυγόνο στα 2 ATA, πέντε ημέρες την εβδομάδα), ενώ η άλλη αποτέλεσε ομάδα ελέγχου χωρίς θεραπεία για δύο μήνες πριν περάσει διασταυρούμενα στο ίδιο σχήμα HBOT. Η νευρολογική λειτουργία (NIHSS), οι δραστηριότητες καθημερινής ζωής και η ποιότητα ζωής βελτιώθηκαν σημαντικά μετά την HBOT αλλά όχι κατά την περίοδο ελέγχου, και το SPECT έδειξε αυξημένη δραστηριότητα κυρίως σε περιοχές που εμφανίζονταν βιώσιμες στην αξονική τομογραφία αλλά είχαν χαμηλή μεταβολική δραστηριότητα.\n\nΜια ανεξάρτητη τυχαιοποιημένη δοκιμή σκοπιμότητας στο Τορόντο, σε 27 ασθενείς 3–48 μήνες μετά από εγκεφαλικό (Schiavo 2020), διαπίστωσε ότι η HBOT σε συνδυασμό με πρόγραμμα άσκησης άνω άκρου και νοερής απεικόνισης είναι ασφαλής και εφικτή, με τάσεις βελτίωσης της κινητικής λειτουργίας του άνω άκρου· οι διαφορές μεταξύ των ομάδων δεν ήταν στατιστικά σημαντικές.\n\nΑυτά τα στοιχεία της χρόνιας φάσης πρέπει να διακρίνονται από το οξύ εγκεφαλικό: μια συστηματική ανασκόπηση Cochrane 11 τυχαιοποιημένων δοκιμών με 705 συμμετέχοντες δεν βρήκε επαρκή στοιχεία ότι η HBOT βελτιώνει τις κλινικές εκβάσεις όταν εφαρμόζεται κατά την οξεία εκδήλωση ισχαιμικού εγκεφαλικού, σημειώνοντας ωστόσο ότι η πιθανότητα οφέλους δεν έχει αποκλειστεί (Bennett 2014).\n\nΗ κύρια δοκιμή της χρόνιας φάσης δεν είχε εικονική (sham) ομάδα ελέγχου, οπότε οι συμμετέχοντες γνώριζαν την κατανομή τους, και προέρχεται από την ίδια ισραηλινή ερευνητική ομάδα (Assaf Harofeh, νυν Shamir Medical Center) με τις καταχωρήσεις Long COVID, Ινομυαλγίας και ΔΜΤΣ. Το πρωτόκολλο όπως μελετήθηκε —όχι κλινική σύσταση— περιελάμβανε 40 καθημερινές συνεδρίες των 90 λεπτών, 100% οξυγόνο στα 2 ATA, πέντε ημέρες την εβδομάδα. Η HBOT για την αποκατάσταση μετά από εγκεφαλικό παραμένει ερευνητική και δεν είναι εγκεκριμένη από το FDA."
  de: "Viele Schlaganfallüberlebende behalten motorische, sensorische und kognitive Defizite lange nach dem akuten Ereignis, und die Fortschritte der konventionellen Rehabilitation erreichen typischerweise in den folgenden Monaten ein Plateau. HBOT wurde in dieser chronischen Phase als Möglichkeit untersucht, die Neuroplastizität in Hirnregionen zu reaktivieren, die zwar lebensfähig sind, aber unzureichend funktionieren.\n\nEine prospektive randomisierte Studie schloss 74 Patienten 6–36 Monate nach einem Schlaganfall ein, von denen 59 ausgewertet wurden (Efrati 2013): Eine Gruppe erhielt 40 HBOT-Sitzungen (90 Minuten, 100% Sauerstoff bei 2 ATA, fünf Tage pro Woche), während die andere zwei Monate lang als unbehandelte Kontrollgruppe diente, bevor sie im Crossover dieselbe HBOT-Behandlung erhielt. Neurologische Funktion (NIHSS), Aktivitäten des täglichen Lebens und Lebensqualität verbesserten sich nach HBOT signifikant, nicht jedoch während der Kontrollphase, und das SPECT zeigte eine erhöhte Aktivität vor allem in Regionen, die im CT vital erschienen, aber eine geringe Stoffwechselaktivität aufwiesen.\n\nEine unabhängige randomisierte Machbarkeitsstudie in Toronto mit 27 Patienten 3–48 Monate nach einem Schlaganfall (Schiavo 2020) fand HBOT in Kombination mit einem Programm aus Übungen der oberen Extremität und mentaler Vorstellung sicher und durchführbar, mit Trends zu einer verbesserten motorischen Funktion der oberen Extremität; die Unterschiede zwischen den Gruppen waren statistisch nicht signifikant.\n\nDiese Evidenz aus der chronischen Phase ist vom akuten Schlaganfall zu unterscheiden: Ein Cochrane-Review von 11 randomisierten Studien mit 705 Teilnehmenden fand keine belastbare Evidenz, dass HBOT die klinischen Ergebnisse verbessert, wenn sie in der Akutphase eines ischämischen Schlaganfalls angewendet wird, hielt aber fest, dass ein möglicher Nutzen nicht ausgeschlossen ist (Bennett 2014).\n\nDie wichtigste Studie der chronischen Phase hatte keine Schein-(Sham-)Kontrolle, sodass die Teilnehmenden ihre Gruppenzuteilung kannten, und sie stammt von derselben israelischen Forschungsgruppe (Assaf Harofeh, heute Shamir Medical Center) wie die Einträge zu Long COVID, Fibromyalgie und PTBS. Das untersuchte Protokoll — keine klinische Empfehlung — umfasste 40 tägliche Sitzungen von 90 Minuten, 100% Sauerstoff bei 2 ATA, fünf Tage pro Woche. HBOT zur Genesung nach Schlaganfall bleibt experimentell und ist nicht von der FDA zugelassen."
  it: "Molti sopravvissuti a un ictus conservano deficit motori, sensitivi e cognitivi a lungo dopo l'evento acuto, e i progressi della riabilitazione convenzionale tendono a stabilizzarsi nei mesi successivi. L'HBOT è stata studiata in questa fase cronica come mezzo per riattivare la neuroplasticità in regioni cerebrali ancora vitali ma ipofunzionanti.\n\nUno studio prospettico randomizzato ha arruolato 74 pazienti a 6–36 mesi da un ictus, di cui 59 sono stati analizzati (Efrati 2013): un gruppo ha ricevuto 40 sedute di HBOT (90 minuti, ossigeno al 100% a 2 ATA, cinque giorni alla settimana), mentre l'altro ha fatto da controllo senza trattamento per due mesi prima di passare in crossover allo stesso ciclo di HBOT. La funzione neurologica (NIHSS), le attività della vita quotidiana e la qualità della vita sono migliorate in modo significativo dopo l'HBOT ma non durante il periodo di controllo, e la SPECT ha mostrato un aumento dell'attività soprattutto in regioni che apparivano vitali alla TC ma con bassa attività metabolica.\n\nUno studio randomizzato di fattibilità indipendente condotto a Toronto su 27 pazienti a 3–48 mesi da un ictus (Schiavo 2020) ha rilevato che l'HBOT combinata con un programma di esercizio dell'arto superiore e immaginazione mentale è sicura e fattibile, con tendenze al miglioramento della funzione motoria dell'arto superiore; le differenze tra i gruppi non sono risultate statisticamente significative.\n\nQueste evidenze in fase cronica vanno distinte dall'ictus acuto: una revisione sistematica Cochrane di 11 studi randomizzati con 705 partecipanti non ha trovato evidenze solide che l'HBOT migliori gli esiti clinici quando applicata nella fase acuta dell'ictus ischemico, pur osservando che la possibilità di un beneficio non è stata esclusa (Bennett 2014).\n\nIl principale studio in fase cronica non prevedeva un controllo sham, per cui i partecipanti conoscevano la propria assegnazione, e proviene dallo stesso gruppo di ricerca israeliano (Assaf Harofeh, oggi Shamir Medical Center) delle voci Long COVID, Fibromialgia e PTSD. Il protocollo così come studiato — non una raccomandazione clinica — prevedeva 40 sedute quotidiane di 90 minuti, ossigeno al 100% a 2 ATA, cinque giorni alla settimana. L'HBOT per il recupero post-ictus rimane sperimentale e non è approvata dalla FDA."
  es: "Muchos supervivientes de un ictus conservan déficits motores, sensitivos y cognitivos mucho después del episodio agudo, y los avances de la rehabilitación convencional suelen estabilizarse en los meses siguientes. La HBOT se ha estudiado en esta fase crónica como medio para reactivar la neuroplasticidad en regiones cerebrales que siguen vivas pero funcionan de forma deficiente.\n\nUn ensayo prospectivo aleatorizado incluyó a 74 pacientes de 6–36 meses tras un ictus, de los cuales se analizaron 59 (Efrati 2013): un grupo recibió 40 sesiones de HBOT (90 minutos, oxígeno al 100% a 2 ATA, cinco días por semana), mientras que el otro actuó como control sin tratamiento durante dos meses antes de pasar de forma cruzada al mismo ciclo de HBOT. La función neurológica (NIHSS), las actividades de la vida diaria y la calidad de vida mejoraron significativamente tras la HBOT, pero no durante el periodo de control, y la SPECT mostró un aumento de la actividad principalmente en regiones que parecían viables en la TC pero presentaban baja actividad metabólica.\n\nUn ensayo aleatorizado de viabilidad independiente realizado en Toronto con 27 pacientes de 3–48 meses tras un ictus (Schiavo 2020) halló que la HBOT combinada con un programa de ejercicio del miembro superior e imaginería mental es segura y viable, con tendencias hacia una mejor función motora del miembro superior; las diferencias entre los grupos no fueron estadísticamente significativas.\n\nEsta evidencia de la fase crónica debe distinguirse del ictus agudo: una revisión sistemática Cochrane de 11 ensayos aleatorizados con 705 participantes no encontró evidencia sólida de que la HBOT mejore los resultados clínicos cuando se aplica en la fase aguda del ictus isquémico, aunque señaló que no se ha descartado la posibilidad de beneficio (Bennett 2014).\n\nEl principal ensayo de la fase crónica no tuvo control simulado (sham), por lo que los participantes conocían su asignación, y procede del mismo grupo de investigación israelí (Assaf Harofeh, actualmente Shamir Medical Center) que las entradas de COVID persistente, fibromialgia y TEPT. El protocolo tal como se estudió —no una recomendación clínica— consistió en 40 sesiones diarias de 90 minutos, oxígeno al 100% a 2 ATA, cinco días por semana. La HBOT para la recuperación tras un ictus sigue siendo experimental y no está aprobada por la FDA."
  fr: "De nombreux survivants d'un accident vasculaire cérébral (AVC) conservent des déficits moteurs, sensitifs et cognitifs longtemps après l'épisode aigu, et les progrès obtenus par la rééducation conventionnelle atteignent généralement un plateau dans les mois qui suivent. L'HBOT a été étudiée dans cette phase chronique comme moyen de réactiver la neuroplasticité dans des régions cérébrales qui restent vivantes mais hypofonctionnelles.\n\nUn essai randomisé prospectif a inclus 74 patients 6–36 mois après leur AVC, dont 59 ont été analysés (Efrati 2013) : un groupe a reçu 40 séances d'HBOT (90 minutes, 100 % d'oxygène à 2 ATA, cinq jours par semaine), tandis que l'autre a servi de groupe témoin sans traitement pendant deux mois avant de recevoir à son tour le même protocole d'HBOT. La fonction neurologique (NIHSS), les activités de la vie quotidienne et la qualité de vie se sont significativement améliorées après l'HBOT mais pas pendant la période témoin, et la SPECT a montré une augmentation de l'activité principalement dans des régions qui paraissaient viables au scanner (TDM) mais présentaient une faible activité métabolique.\n\nUn essai de faisabilité randomisé indépendant mené à Toronto chez 27 patients 3–48 mois après leur AVC (Schiavo 2020) a jugé sûre et faisable l'association de l'HBOT à un programme d'exercices du membre supérieur et d'imagerie mentale, avec des tendances à l'amélioration de la fonction motrice du membre supérieur ; les différences entre les groupes n'étaient pas statistiquement significatives.\n\nCes données en phase chronique doivent être distinguées de celles concernant l'AVC aigu : une revue systématique Cochrane de 11 essais randomisés portant sur 705 participants n'a trouvé aucune preuve solide que l'HBOT améliore les résultats cliniques lorsqu'elle est appliquée à la phase aiguë de l'AVC ischémique, tout en notant que la possibilité d'un bénéfice n'a pas été exclue (Bennett 2014).\n\nLe principal essai en phase chronique ne comportait pas de contrôle par simulation, de sorte que les participants connaissaient leur groupe d'allocation, et il provient du même groupe de recherche israélien (Assaf Harofeh, aujourd'hui Shamir Medical Center) que les fiches COVID long, Fibromyalgie et TSPT. Le protocole tel qu'étudié — pas une recommandation clinique — comprenait 40 séances quotidiennes de 90 minutes, à 100 % d'oxygène à 2 ATA, cinq jours par semaine. L'HBOT dans la récupération après un AVC reste expérimentale et n'est pas approuvée par la FDA."

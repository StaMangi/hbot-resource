condition:
  en: "Post-Traumatic Stress Disorder (PTSD)"
  el: "Διαταραχή Μετατραυματικού Στρες (ΔΜΤΣ)"
  de: "Posttraumatische Belastungsstörung (PTBS)"
  it: "Disturbo da stress post-traumatico (PTSD)"
  es: "Trastorno de estrés postraumático (TEPT)"
description:
  en: "Post-traumatic stress disorder (PTSD) is a trauma- and stressor-related disorder marked by intrusive memories, avoidance, hyperarousal, and altered mood and cognition, with documented changes in brain activity and white-matter integrity. A specific HBOT protocol has been studied as a means of inducing neuroplasticity in established, often treatment-resistant PTSD; rather than acting pharmacologically, it is proposed to drive neuroplasticity through the hyperoxic-hypoxic paradox, accompanied in trials by improved resting-state functional connectivity across the default-mode, central-executive and salience networks (2024) and increased white-matter fractional anisotropy in fronto-limbic tracts, the genu of the corpus callosum and the fornix on diffusion tensor imaging (2022). A randomised, sham-controlled trial in 56 combat veterans (60 sessions, 90 minutes, 100% O₂ at 2 ATA) found CAPS-5 scores fell from 42.6 to 25.8 with HBOT while the sham group did not improve; an earlier randomised controlled trial in treatment-resistant PTSD showed concordant symptom and neuroimaging improvements; a 2026 systematic review and meta-analysis pooled two sham-controlled PTSD RCTs and reported a large effect while cautioning that studies are small and preliminary; and a 2026 prospective observational cohort of 50 US veterans reported reductions sustained to six months. The investigational protocol as studied — not a clinical recommendation — comprised 60 daily sessions of 90 minutes, 100% oxygen at 2 ATA, with intermittent air breaks. The randomised evidence originates substantially from a single research group (Sagol Center / Shamir Medical Center) — the same lineage as the Long COVID and Fibromyalgia entries — though, unlike those, there is now early independent corroboration (a US observational cohort and a meta-analysis by an unaffiliated group). Sample sizes remain small and larger multicentre randomised trials are needed. HBOT for PTSD remains investigational and is not FDA-approved."
  el: "Η διαταραχή μετατραυματικού στρες (ΔΜΤΣ) είναι μια διαταραχή σχετιζόμενη με τραύμα και στρεσογόνους παράγοντες, που χαρακτηρίζεται από παρεμβατικές αναμνήσεις, αποφυγή, υπερδιέγερση και μεταβολές στη διάθεση και τη γνωστική λειτουργία, με τεκμηριωμένες αλλαγές στην εγκεφαλική δραστηριότητα και την ακεραιότητα της λευκής ουσίας. Ένα συγκεκριμένο πρωτόκολλο HBOT έχει μελετηθεί ως μέσο επαγωγής νευροπλαστικότητας σε εδραιωμένη, συχνά ανθεκτική στη θεραπεία ΔΜΤΣ· αντί να δρα φαρμακολογικά, προτείνεται ότι οδηγεί τη νευροπλαστικότητα μέσω του υπεροξικού-υποξικού παραδόξου, συνοδευόμενο σε δοκιμές από βελτιωμένη λειτουργική συνδεσιμότητα ηρεμίας στα δίκτυα προεπιλεγμένης λειτουργίας, κεντρικής εκτέλεσης και προβολής (salience) (2024) και αυξημένη κλασματική ανισοτροπία λευκής ουσίας σε μετωπο-μεταιχμιακές οδούς, το γόνυ του μεσολοβίου και τον θόλο σε απεικόνιση τανυστή διάχυσης (DTI) (2022). Μια τυχαιοποιημένη, εικονικά ελεγχόμενη (sham) δοκιμή σε 56 βετεράνους μάχης (60 συνεδρίες, 90 λεπτά, 100% O₂ στα 2 ATA) διαπίστωσε ότι οι βαθμολογίες CAPS-5 μειώθηκαν από 42,6 σε 25,8 με την HBOT, ενώ η ομάδα εικονικής θεραπείας δεν βελτιώθηκε· μια προγενέστερη τυχαιοποιημένη ελεγχόμενη δοκιμή (ΤΕΔ) σε ανθεκτική στη θεραπεία ΔΜΤΣ έδειξε σύμφωνες βελτιώσεις συμπτωμάτων και νευροαπεικόνισης· μια συστηματική ανασκόπηση και μετα-ανάλυση του 2026 συγκέντρωσε δύο εικονικά ελεγχόμενες ΤΕΔ για τη ΔΜΤΣ και ανέφερε μεγάλο μέγεθος επίδρασης, με την επιφύλαξη ότι οι μελέτες είναι μικρές και προκαταρκτικές· και μια προοπτική παρατηρησιακή κοόρτη του 2026 με 50 βετεράνους των ΗΠΑ ανέφερε μειώσεις που διατηρήθηκαν στους έξι μήνες. Το ερευνητικό πρωτόκολλο όπως μελετήθηκε —όχι κλινική σύσταση— περιελάμβανε 60 καθημερινές συνεδρίες των 90 λεπτών, 100% οξυγόνο στα 2 ATA, με διαλείμματα αέρα. Τα τυχαιοποιημένα στοιχεία προέρχονται σε μεγάλο βαθμό από μία ερευνητική ομάδα (Sagol Center / Shamir Medical Center) —την ίδια προέλευση με τις καταχωρήσεις Long COVID και Ινομυαλγίας— αν και, σε αντίθεση με εκείνες, υπάρχει πλέον πρώιμη ανεξάρτητη επιβεβαίωση (μια παρατηρησιακή κοόρτη των ΗΠΑ και μια μετα-ανάλυση από μη συνδεδεμένη ομάδα). Τα μεγέθη δείγματος παραμένουν μικρά και απαιτούνται μεγαλύτερες πολυκεντρικές τυχαιοποιημένες δοκιμές. Η HBOT για τη ΔΜΤΣ παραμένει ερευνητική και δεν είναι εγκεκριμένη από το FDA."
  de: "Die posttraumatische Belastungsstörung (PTBS) ist eine trauma- und stressbezogene Störung, die durch sich aufdrängende Erinnerungen, Vermeidung, Übererregung sowie veränderte Stimmung und Kognition gekennzeichnet ist, mit dokumentierten Veränderungen der Hirnaktivität und der Integrität der weißen Substanz. Ein spezifisches HBOT-Protokoll wurde als Mittel zur Induktion von Neuroplastizität bei etablierter, oft therapieresistenter PTBS untersucht; statt pharmakologisch zu wirken, soll es die Neuroplastizität über das hyperoxisch-hypoxische Paradox antreiben, begleitet in Studien von verbesserter funktioneller Ruhekonnektivität im Default-Mode-, im zentral-exekutiven und im Salienz-Netzwerk (2024) sowie erhöhter fraktioneller Anisotropie der weißen Substanz in fronto-limbischen Bahnen, dem Genu des Corpus callosum und dem Fornix in der Diffusions-Tensor-Bildgebung (DTI) (2022). Eine randomisierte, scheinkontrollierte (Sham-)Studie an 56 Kampfveteranen (60 Sitzungen, 90 Minuten, 100% O₂ bei 2 ATA) ergab, dass die CAPS-5-Werte unter HBOT von 42,6 auf 25,8 fielen, während sich die Sham-Gruppe nicht verbesserte; eine frühere randomisierte kontrollierte Studie (RKS) bei therapieresistenter PTBS zeigte übereinstimmende Verbesserungen der Symptome und der Bildgebung; eine systematische Übersichtsarbeit und Metaanalyse von 2026 fasste zwei scheinkontrollierte PTBS-RKS zusammen und berichtete einen großen Effekt, mahnte jedoch, dass die Studien klein und vorläufig sind; und eine prospektive Beobachtungskohorte von 2026 mit 50 US-Veteranen berichtete über bis zu sechs Monate anhaltende Reduktionen. Das untersuchte experimentelle Protokoll — keine klinische Empfehlung — umfasste 60 tägliche Sitzungen von 90 Minuten, 100% Sauerstoff bei 2 ATA, mit intermittierenden Luftpausen. Die randomisierte Evidenz stammt überwiegend von einer einzelnen Forschungsgruppe (Sagol Center / Shamir Medical Center) — derselben Herkunft wie die Einträge zu Long COVID und Fibromyalgie —, wenngleich es, anders als bei jenen, inzwischen eine frühe unabhängige Bestätigung gibt (eine US-Beobachtungskohorte und eine Metaanalyse einer nicht assoziierten Gruppe). Die Stichprobengrößen bleiben klein, und größere multizentrische randomisierte Studien sind erforderlich. HBOT bei PTBS bleibt experimentell und ist nicht von der FDA zugelassen."
  it: "Il disturbo da stress post-traumatico (PTSD) è un disturbo correlato a trauma ed eventi stressanti, caratterizzato da memorie intrusive, evitamento, iperarousal e alterazioni dell'umore e della cognizione, con cambiamenti documentati dell'attività cerebrale e dell'integrità della sostanza bianca. Un protocollo HBOT specifico è stato studiato come mezzo per indurre neuroplasticità nel PTSD consolidato, spesso resistente al trattamento; anziché agire farmacologicamente, si propone che promuova la neuroplasticità attraverso il paradosso iperossico-ipossico, accompagnato negli studi da una migliore connettività funzionale a riposo nelle reti del default-mode, esecutiva centrale e della salienza (2024) e da un aumento dell'anisotropia frazionaria della sostanza bianca nei tratti fronto-limbici, nel ginocchio del corpo calloso e nel fornice all'imaging del tensore di diffusione (DTI) (2022). Uno studio randomizzato controllato con sham in 56 veterani di combattimento (60 sedute, 90 minuti, 100% O₂ a 2 ATA) ha rilevato che i punteggi CAPS-5 sono scesi da 42,6 a 25,8 con l'HBOT, mentre il gruppo sham non è migliorato; un precedente studio clinico randomizzato controllato (RCT) nel PTSD resistente al trattamento ha mostrato miglioramenti concordanti dei sintomi e del neuroimaging; una revisione sistematica e metanalisi del 2026 ha aggregato due RCT con sham sul PTSD e ha riportato un ampio effetto, avvertendo però che gli studi sono piccoli e preliminari; e una coorte osservazionale prospettica del 2026 di 50 veterani statunitensi ha riportato riduzioni mantenute a sei mesi. Il protocollo sperimentale così come studiato — non una raccomandazione clinica — prevedeva 60 sedute quotidiane di 90 minuti, ossigeno al 100% a 2 ATA, con pause d'aria intermittenti. Le evidenze randomizzate provengono in larga parte da un singolo gruppo di ricerca (Sagol Center / Shamir Medical Center) — la stessa origine delle voci Long COVID e Fibromialgia — anche se, a differenza di quelle, esiste ora una prima conferma indipendente (una coorte osservazionale statunitense e una metanalisi di un gruppo non affiliato). Le dimensioni dei campioni restano piccole e sono necessari studi randomizzati multicentrici più ampi. L'HBOT per il PTSD rimane sperimentale e non è approvata dalla FDA."
  es: "El trastorno de estrés postraumático (TEPT) es un trastorno relacionado con el trauma y los factores estresantes, caracterizado por recuerdos intrusivos, evitación, hiperexcitación y alteraciones del estado de ánimo y la cognición, con cambios documentados en la actividad cerebral y la integridad de la sustancia blanca. Se ha estudiado un protocolo específico de HBOT como medio para inducir neuroplasticidad en el TEPT establecido, a menudo resistente al tratamiento; en lugar de actuar farmacológicamente, se propone que impulsa la neuroplasticidad a través de la paradoja hiperóxica-hipóxica, acompañada en los ensayos de una mejor conectividad funcional en reposo en las redes por defecto, ejecutiva central y de saliencia (2024) y de un aumento de la anisotropía fraccional de la sustancia blanca en los tractos fronto-límbicos, la rodilla del cuerpo calloso y el fórnix en la imagen por tensor de difusión (DTI) (2022). Un ensayo aleatorizado controlado con simulación (sham) en 56 veteranos de combate (60 sesiones, 90 minutos, 100% O₂ a 2 ATA) halló que las puntuaciones CAPS-5 descendieron de 42.6 a 25.8 con la HBOT, mientras que el grupo de simulación no mejoró; un ensayo clínico aleatorizado controlado (ECA) anterior en TEPT resistente al tratamiento mostró mejoras concordantes de los síntomas y de la neuroimagen; una revisión sistemática y metaanálisis de 2026 agrupó dos ECA con simulación sobre el TEPT y notificó un efecto grande, advirtiendo no obstante que los estudios son pequeños y preliminares; y una cohorte observacional prospectiva de 2026 de 50 veteranos estadounidenses notificó reducciones mantenidas a los seis meses. El protocolo experimental tal como se estudió —no una recomendación clínica— consistió en 60 sesiones diarias de 90 minutos, oxígeno al 100% a 2 ATA, con pausas de aire intermitentes. La evidencia aleatorizada procede en gran medida de un único grupo de investigación (Sagol Center / Shamir Medical Center) —la misma procedencia que las entradas de COVID persistente y fibromialgia—, aunque, a diferencia de aquellas, ahora existe una corroboración independiente temprana (una cohorte observacional estadounidense y un metaanálisis de un grupo no afiliado). Los tamaños muestrales siguen siendo pequeños y se necesitan ensayos aleatorizados multicéntricos más amplios. La HBOT para el TEPT sigue siendo experimental y no está aprobada por la FDA."

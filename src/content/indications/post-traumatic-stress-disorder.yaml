answerBox:
  en: "Post-traumatic stress disorder is an increasingly studied HBOT target. A sham-controlled randomised trial in combat veterans reported substantial reductions in PTSD severity alongside measurable changes in brain connectivity, with early independent corroboration. The randomised evidence comes largely from one research group; HBOT for PTSD remains investigational and is not FDA-approved."
  el: "Η διαταραχή μετατραυματικού στρες αποτελεί ολοένα και περισσότερο μελετημένο στόχο για την HBOT. Μια τυχαιοποιημένη, εικονικά ελεγχόμενη μελέτη σε βετεράνους μάχης ανέφερε ουσιαστική μείωση της σοβαρότητας του PTSD παράλληλα με μετρήσιμες μεταβολές στην εγκεφαλική συνδεσιμότητα, με πρώιμη ανεξάρτητη επιβεβαίωση. Η τυχαιοποιημένη τεκμηρίωση προέρχεται κυρίως από μία ερευνητική ομάδα· η HBOT για το PTSD παραμένει ερευνητική και δεν είναι εγκεκριμένη από το FDA."
  de: "Die posttraumatische Belastungsstörung ist ein zunehmend untersuchtes HBOT-Zielgebiet. Eine sham-kontrollierte randomisierte Studie bei Kampfveteranen berichtete substanzielle Reduktionen des PTSD-Schweregrads zusammen mit messbaren Veränderungen der Gehirnkonnektivität, mit früher unabhängiger Bestätigung. Die randomisierte Evidenz stammt weitgehend aus einer einzigen Forschungsgruppe; HBOT bei PTSD bleibt in Erprobung und ist nicht FDA-zugelassen."
  it: "Il disturbo da stress post-traumatico è un obiettivo HBOT sempre più studiato. Uno studio randomizzato sham-controllato in veterani da combattimento ha riportato sostanziali riduzioni della gravità del PTSD insieme a cambiamenti misurabili della connettività cerebrale, con una conferma indipendente iniziale. L'evidenza randomizzata proviene in gran parte da un unico gruppo di ricerca; l'HBOT per il PTSD resta sperimentale e non è approvata dalla FDA."
  es: "El trastorno por estrés postraumático es un objetivo cada vez más estudiado de la HBOT. Un ensayo aleatorizado con control simulado en veteranos de combate informó reducciones sustanciales de la gravedad del PTSD junto con cambios medibles en la conectividad cerebral, con una corroboración independiente inicial. La evidencia aleatorizada procede en gran parte de un único grupo de investigación; la HBOT para el PTSD sigue siendo investigacional y no está aprobada por la FDA."

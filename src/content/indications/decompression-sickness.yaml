  es: "Tratamiento primario de la formación de burbujas de nitrógeno en buceadores y trabajadores expuestos a aire comprimido. Reduce el volumen de las burbujas y favorece la eliminación del nitrógeno."
  fr: "Traitement de première intention de la formation de bulles d'azote chez les plongeurs et les travailleurs en air comprimé. Réduit le volume des bulles et favorise l'élimination de l'azote."

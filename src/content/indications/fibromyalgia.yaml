description:
  en: "Chronic central sensitisation syndrome characterised by widespread pain, tender points, fatigue, sleep disturbance, and cognitive symptoms. A 2015 prospective controlled trial reported significant improvements in pain, tender points, quality of life, and brain activity patterns after 40 HBOT sessions at 2.0 ATA. Two independent 2023 meta-analyses pooled randomised data and confirmed improvements in function, tender points, fatigue, sleep, and quality of life — though the magnitude of pain reduction varied between pooled analyses. A separate 2023 RCT in fibromyalgia patients with a history of traumatic brain injury reported significant pain and symptom improvements with HBOT compared to pharmacological treatment (60 sessions, 2.0 ATA). The seminal RCT remains anchored to a single research group, but meta-analytic confirmation provides supporting evidence."
  el: "Σύνδρομο χρόνιας κεντρικής ευαισθητοποίησης που χαρακτηρίζεται από εκτεταμένο πόνο, ευαίσθητα σημεία, κόπωση, διαταραχές ύπνου και γνωστικά συμπτώματα. Προοπτική ελεγχόμενη δοκιμή του 2015 ανέφερε σημαντικές βελτιώσεις σε πόνο, ευαίσθητα σημεία, ποιότητα ζωής και πρότυπα εγκεφαλικής δραστηριότητας μετά από 40 συνεδρίες HBOT στα 2.0 ATA. Δύο ανεξάρτητες μετα-αναλύσεις του 2023 συγκέντρωσαν τυχαιοποιημένα δεδομένα και επιβεβαίωσαν βελτιώσεις σε λειτουργικότητα, ευαίσθητα σημεία, κόπωση, ύπνο και ποιότητα ζωής — αν και το μέγεθος μείωσης του πόνου διέφερε μεταξύ των συγκεντρωτικών αναλύσεων. Ξεχωριστή Τυχαιοποιημένη Ελεγχόμενη Δοκιμή (ΤΕΔ) του 2023 σε ασθενείς με ινομυαλγία και ιστορικό τραυματικής εγκεφαλικής κάκωσης ανέφερε σημαντικές βελτιώσεις πόνου και συμπτωμάτων με HBOT έναντι φαρμακευτικής αγωγής (60 συνεδρίες, 2.0 ATA). Η θεμελιώδης ΤΕΔ παραμένει αγκιστρωμένη σε μία ερευνητική ομάδα, αλλά η μετα-αναλυτική επιβεβαίωση παρέχει υποστηρικτικά στοιχεία."
  de: "Chronisches zentrales Sensibilisierungssyndrom, gekennzeichnet durch generalisierten Schmerz, Tender Points, Fatigue, Schlafstörungen und kognitive Symptome. Eine prospektive kontrollierte Studie von 2015 berichtete über signifikante Verbesserungen bei Schmerzen, Tender Points, Lebensqualität und Hirnaktivitätsmustern nach 40 HBOT-Sitzungen bei 2,0 ATA. Zwei unabhängige Metaanalysen von 2023 fassten randomisierte Daten zusammen und bestätigten Verbesserungen bei Funktion, Tender Points, Fatigue, Schlaf und Lebensqualität — wobei die Größenordnung der Schmerzreduktion zwischen den gepoolten Analysen variierte. Eine separate randomisierte kontrollierte Studie (RKS) von 2023 bei Fibromyalgie-Patienten mit traumatischer Hirnverletzung in der Vorgeschichte berichtete über signifikante Schmerz- und Symptomverbesserungen mit HBOT im Vergleich zur pharmakologischen Behandlung (60 Sitzungen, 2,0 ATA). Die wegweisende RKS bleibt auf eine einzelne Forschungsgruppe gestützt, aber die metaanalytische Bestätigung liefert unterstützende Evidenz."
  it: "Sindrome cronica da sensibilizzazione centrale caratterizzata da dolore diffuso, tender points, affaticamento, disturbi del sonno e sintomi cognitivi. Uno studio controllato prospettico del 2015 ha riportato miglioramenti significativi del dolore, dei tender points, della qualità della vita e dei pattern di attività cerebrale dopo 40 sedute di HBOT a 2.0 ATA. Due metanalisi indipendenti del 2023 hanno aggregato dati randomizzati e confermato miglioramenti della funzione, dei tender points, dell'affaticamento, del sonno e della qualità della vita — sebbene l'entità della riduzione del dolore sia variata tra le analisi aggregate. Un separato studio clinico randomizzato controllato (RCT) del 2023 in pazienti con fibromialgia e anamnesi di lesione cerebrale traumatica ha riportato miglioramenti significativi del dolore e dei sintomi con l'HBOT rispetto al trattamento farmacologico (60 sedute, 2.0 ATA). L'RCT fondamentale resta ancorato a un singolo gruppo di ricerca, ma la conferma metanalitica fornisce evidenze di supporto."

condition:
  en: "Avascular Necrosis of the Femoral Head"
  el: "Άσηπτη Νέκρωση της Μηριαίας Κεφαλής"
  de: "Avaskuläre Femurkopfnekrose"
  it: "Necrosi avascolare della testa del femore"
  es: "Necrosis avascular de la cabeza femoral"
description:
  en: "In avascular (aseptic) necrosis, part of a bone loses its blood supply and dies; in the hip, the femoral head can eventually collapse, often leading to joint replacement. HBOT has been studied in early-stage disease as a way to relieve pain and support repair of the bone. The UHMS lists avascular necrosis among its approved indications (No. 15), but it is not on the US FDA's list of cleared uses and Medicare does not cover it.\n\nIn a small double-blind randomised trial, 20 patients with Ficat stage II femoral head necrosis received 30 sessions of hyperbaric oxygen or compressed air over six weeks: pain improved significantly with oxygen after 20 treatments, and seven years later none had required hip replacement — although after six weeks the air group was offered oxygen, so long-term follow-up was not controlled (Camporesi 2010). A 2021 meta-analysis of 10 cohort studies (368 treated patients and 353 controls; seven of the studies from China) found significant clinical improvement with HBOT, but the benefit was not significant in non-Asian patients (Paderno 2021). A 2025 meta-analysis of 10 studies (568 participants) found improvement from baseline but no difference between HBOT and non-HBOT groups, and concluded that HBOT cannot be regarded as an effective treatment for early-stage femoral head necrosis (Cao 2025).\n\nThe evidence is therefore conflicting and largely observational. One protocol studied — not a clinical recommendation — used two cycles of 30 daily sessions of 90 minutes at 2.5 ATA, with a 30-day break between cycles (Bosco 2018)."
  el: "Στην άσηπτη (ισχαιμική) νέκρωση, τμήμα του οστού χάνει την αιμάτωσή του και νεκρώνεται· στο ισχίο, η μηριαία κεφαλή μπορεί τελικά να καταρρεύσει, οδηγώντας συχνά σε αρθροπλαστική. Η HBOT έχει μελετηθεί στα πρώιμα στάδια της νόσου ως τρόπος ανακούφισης του πόνου και υποστήριξης της αποκατάστασης του οστού. Η UHMS περιλαμβάνει την άσηπτη νέκρωση στις εγκεκριμένες ενδείξεις της (αρ. 15), αλλά δεν περιλαμβάνεται στη λίστα εγκρίσεων του αμερικανικού FDA και δεν καλύπτεται από το Medicare.\n\nΣε μια μικρή διπλά τυφλή τυχαιοποιημένη δοκιμή, 20 ασθενείς με νέκρωση της μηριαίας κεφαλής σταδίου II κατά Ficat έλαβαν 30 συνεδρίες υπερβαρικού οξυγόνου ή πεπιεσμένου αέρα σε έξι εβδομάδες: ο πόνος βελτιώθηκε σημαντικά με το οξυγόνο μετά από 20 συνεδρίες, και επτά χρόνια αργότερα κανείς δεν είχε χρειαστεί αρθροπλαστική ισχίου — ωστόσο μετά τις έξι εβδομάδες προσφέρθηκε οξυγόνο και στην ομάδα του αέρα, οπότε η μακροχρόνια παρακολούθηση δεν ήταν ελεγχόμενη (Camporesi 2010). Μια μετα-ανάλυση του 2021 με 10 μελέτες κοορτής (368 ασθενείς που έλαβαν θεραπεία και 353 μάρτυρες· επτά από τις μελέτες από την Κίνα) βρήκε σημαντική κλινική βελτίωση με την HBOT, αλλά το όφελος δεν ήταν σημαντικό σε μη ασιατικούς πληθυσμούς (Paderno 2021). Μια μετα-ανάλυση του 2025 με 10 μελέτες (568 συμμετέχοντες) βρήκε βελτίωση σε σχέση με την αρχική κατάσταση, αλλά καμία διαφορά μεταξύ ομάδων με και χωρίς HBOT, και κατέληξε ότι η HBOT δεν μπορεί να θεωρηθεί αποτελεσματική θεραπεία για την πρώιμη νέκρωση της μηριαίας κεφαλής (Cao 2025).\n\nΤα στοιχεία είναι επομένως αντικρουόμενα και κυρίως από μελέτες παρατήρησης. Ένα πρωτόκολλο που μελετήθηκε —όχι κλινική σύσταση— περιελάμβανε δύο κύκλους 30 καθημερινών συνεδριών των 90 λεπτών στα 2,5 ATA, με διάλειμμα 30 ημερών μεταξύ των κύκλων (Bosco 2018)."
  de: "Bei der avaskulären (aseptischen) Nekrose verliert ein Teil des Knochens seine Blutversorgung und stirbt ab; an der Hüfte kann der Femurkopf schließlich einbrechen, was häufig zum Gelenkersatz führt. HBOT wurde im Frühstadium der Erkrankung untersucht, um Schmerzen zu lindern und die Reparatur des Knochens zu unterstützen. Die UHMS führt die avaskuläre Nekrose unter ihren anerkannten Indikationen (Nr. 15), sie steht jedoch nicht auf der FDA-Liste freigegebener Anwendungen und wird von Medicare nicht übernommen.\n\nIn einer kleinen doppelblinden randomisierten Studie erhielten 20 Patienten mit Femurkopfnekrose im Ficat-Stadium II über sechs Wochen 30 Sitzungen mit hyperbarem Sauerstoff oder Druckluft: Die Schmerzen besserten sich unter Sauerstoff nach 20 Behandlungen signifikant, und sieben Jahre später hatte keiner einen Hüftgelenkersatz benötigt — allerdings wurde der Luftgruppe nach sechs Wochen Sauerstoff angeboten, sodass die Langzeitbeobachtung nicht kontrolliert war (Camporesi 2010). Eine Metaanalyse von 2021 mit 10 Kohortenstudien (368 behandelte Patienten und 353 Kontrollen; sieben der Studien aus China) fand eine signifikante klinische Verbesserung unter HBOT, bei nicht-asiatischen Patienten war der Nutzen jedoch nicht signifikant (Paderno 2021). Eine Metaanalyse von 2025 mit 10 Studien (568 Teilnehmende) fand Verbesserungen gegenüber dem Ausgangswert, aber keinen Unterschied zwischen Gruppen mit und ohne HBOT, und kam zu dem Schluss, dass HBOT nicht als wirksame Behandlung der frühen Femurkopfnekrose gelten kann (Cao 2025).\n\nDie Evidenz ist daher widersprüchlich und überwiegend beobachtend. Ein untersuchtes Protokoll — keine klinische Empfehlung — umfasste zwei Zyklen von je 30 täglichen Sitzungen von 90 Minuten bei 2,5 ATA mit 30 Tagen Pause zwischen den Zyklen (Bosco 2018)."
  it: "Nella necrosi avascolare (asettica) una parte dell'osso perde l'apporto di sangue e va incontro a morte; nell'anca la testa del femore può infine collassare, portando spesso alla sostituzione protesica. L'HBOT è stata studiata nelle fasi iniziali della malattia per alleviare il dolore e favorire la riparazione dell'osso. La UHMS include la necrosi avascolare tra le indicazioni approvate (n. 15), ma essa non figura nell'elenco degli usi autorizzati dalla FDA statunitense e non è coperta da Medicare.\n\nIn un piccolo studio randomizzato in doppio cieco, 20 pazienti con necrosi della testa del femore allo stadio II di Ficat hanno ricevuto 30 sedute di ossigeno iperbarico o di aria compressa in sei settimane: il dolore è migliorato in modo significativo con l'ossigeno dopo 20 trattamenti e, sette anni dopo, nessuno aveva avuto bisogno di una protesi d'anca — tuttavia, dopo sei settimane l'ossigeno è stato offerto anche al gruppo dell'aria, per cui il follow-up a lungo termine non era controllato (Camporesi 2010). Una metanalisi del 2021 su 10 studi di coorte (368 pazienti trattati e 353 controlli; sette degli studi condotti in Cina) ha rilevato un miglioramento clinico significativo con l'HBOT, ma il beneficio non era significativo nei pazienti non asiatici (Paderno 2021). Una metanalisi del 2025 su 10 studi (568 partecipanti) ha rilevato un miglioramento rispetto al basale ma nessuna differenza tra i gruppi con e senza HBOT, concludendo che l'HBOT non può essere considerata un trattamento efficace per la necrosi della testa del femore in fase iniziale (Cao 2025).\n\nLe evidenze sono quindi contrastanti e in gran parte osservazionali. Un protocollo studiato — non una raccomandazione clinica — prevedeva due cicli di 30 sedute quotidiane di 90 minuti a 2,5 ATA, con una pausa di 30 giorni tra i cicli (Bosco 2018)."
  es: "En la necrosis avascular (aséptica), una parte del hueso pierde su riego sanguíneo y muere; en la cadera, la cabeza femoral puede acabar colapsando, lo que a menudo conduce a una prótesis. La HBOT se ha estudiado en fases tempranas de la enfermedad para aliviar el dolor y favorecer la reparación del hueso. La UHMS incluye la necrosis avascular entre sus indicaciones aprobadas (n.º 15), pero no figura en la lista de usos autorizados por la FDA estadounidense y Medicare no la cubre.\n\nEn un pequeño ensayo aleatorizado doble ciego, 20 pacientes con necrosis de la cabeza femoral en estadio II de Ficat recibieron 30 sesiones de oxígeno hiperbárico o de aire comprimido durante seis semanas: el dolor mejoró significativamente con oxígeno tras 20 tratamientos y, siete años después, ninguno había necesitado una prótesis de cadera; sin embargo, tras seis semanas se ofreció oxígeno también al grupo de aire, por lo que el seguimiento a largo plazo no fue controlado (Camporesi 2010). Un metaanálisis de 2021 de 10 estudios de cohortes (368 pacientes tratados y 353 controles; siete de los estudios realizados en China) halló una mejoría clínica significativa con la HBOT, aunque el beneficio no fue significativo en pacientes no asiáticos (Paderno 2021). Un metaanálisis de 2025 de 10 estudios (568 participantes) halló mejoría respecto al inicio, pero ninguna diferencia entre los grupos con y sin HBOT, y concluyó que la HBOT no puede considerarse un tratamiento eficaz para la necrosis de la cabeza femoral en fase temprana (Cao 2025).\n\nPor tanto, la evidencia es contradictoria y en gran parte observacional. Un protocolo estudiado —no una recomendación clínica— consistió en dos ciclos de 30 sesiones diarias de 90 minutos a 2,5 ATA, con una pausa de 30 días entre ciclos (Bosco 2018)."

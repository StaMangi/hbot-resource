answerBox:
  en: "Avascular necrosis of the femoral head occurs when part of the hip bone loses its blood supply and dies. The UHMS lists it as an approved HBOT indication, but it is not FDA-cleared. A small randomised trial and one meta-analysis reported benefit in early-stage disease, while a 2025 meta-analysis found no difference versus other treatment. The evidence is conflicting."
  el: "Η άσηπτη νέκρωση της μηριαίας κεφαλής εμφανίζεται όταν τμήμα του οστού του ισχίου χάνει την αιμάτωσή του και νεκρώνεται. Η UHMS την περιλαμβάνει στις εγκεκριμένες ενδείξεις της HBOT, αλλά δεν έχει εγκριθεί από το FDA. Μια μικρή τυχαιοποιημένη δοκιμή και μία μετα-ανάλυση ανέφεραν όφελος στα πρώιμα στάδια, ενώ μια μετα-ανάλυση του 2025 δεν βρήκε διαφορά έναντι άλλων θεραπειών. Τα στοιχεία είναι αντικρουόμενα."
  de: "Eine avaskuläre Femurkopfnekrose entsteht, wenn ein Teil des Hüftknochens seine Blutversorgung verliert und abstirbt. Die UHMS führt sie als anerkannte HBOT-Indikation, von der FDA ist sie jedoch nicht freigegeben. Eine kleine randomisierte Studie und eine Metaanalyse berichteten über Nutzen im Frühstadium, während eine Metaanalyse von 2025 keinen Unterschied zu anderen Behandlungen fand. Die Evidenz ist widersprüchlich."
  it: "La necrosi avascolare della testa del femore si verifica quando una parte dell'osso dell'anca perde l'apporto di sangue e muore. La UHMS la include tra le indicazioni approvate per l'HBOT, ma non è autorizzata dalla FDA. Un piccolo studio randomizzato e una metanalisi hanno riportato benefici nelle fasi iniziali, mentre una metanalisi del 2025 non ha rilevato differenze rispetto ad altri trattamenti. Le evidenze sono contrastanti."
  es: "La necrosis avascular de la cabeza femoral se produce cuando una parte del hueso de la cadera pierde su riego sanguíneo y muere. La UHMS la incluye entre las indicaciones aprobadas de la HBOT, pero no está autorizada por la FDA. Un pequeño ensayo aleatorizado y un metaanálisis notificaron beneficio en fases tempranas, mientras que un metaanálisis de 2025 no halló diferencias frente a otros tratamientos. La evidencia es contradictoria."
metaDescription:
  en: "HBOT for avascular necrosis of the femoral head: UHMS-approved but not FDA-cleared, with a small positive trial and conflicting meta-analyses."
  el: "HBOT για άσηπτη νέκρωση της μηριαίας κεφαλής: εγκεκριμένη από την UHMS αλλά όχι από το FDA, με μια μικρή θετική δοκιμή και αντικρουόμενες μετα-αναλύσεις."
  de: "HBOT bei avaskulärer Femurkopfnekrose: UHMS-anerkannt, aber nicht FDA-freigegeben, mit einer kleinen positiven Studie und widersprüchlichen Metaanalysen."
  it: "HBOT per la necrosi avascolare della testa del femore: approvata dalla UHMS ma non dalla FDA, con un piccolo studio positivo e metanalisi contrastanti."
  es: "HBOT para la necrosis avascular de la cabeza femoral: aprobada por la UHMS pero no autorizada por la FDA, con un pequeño ensayo positivo y metaanálisis contradictorios."

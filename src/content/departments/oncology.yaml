    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "Effective treatment for late radiation toxicity in breast cancer patients, including radiation dermatitis and tissue necrosis following breast-conserving surgery."
      el: "Αποτελεσματική θεραπεία για όψιμη ακτινοτοξικότητα σε ασθενείς με καρκίνο μαστού, συμπεριλαμβανομένης ακτινοδερματίτιδας και νέκρωσης ιστού μετά από συντηρητική χειρουργική μαστού."
      de: "Wirksame Behandlung der späten Strahlentoxizität bei Brustkrebspatientinnen, einschließlich Strahlendermatitis und Gewebenekrose nach brusterhaltender Operation."
      it: "Trattamento efficace della tossicità radiogena tardiva nelle pazienti con cancro al seno, compresa la radiodermatite e la necrosi tissutale dopo chirurgia conservativa della mammella."
      es: "Tratamiento eficaz de la toxicidad por radiación tardía en pacientes con cáncer de mama, incluida la radiodermatitis y la necrosis tisular tras cirugía conservadora de la mama."
      fr: "Traitement efficace de la toxicité radique tardive chez les patients atteints d'un cancer du sein, notamment la radiodermite et la nécrose tissulaire après chirurgie mammaire conservatrice."

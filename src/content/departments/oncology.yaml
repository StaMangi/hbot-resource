  - title:
      en: "Tumour Radiosensitisation"
      el: "Ακτινοευαισθητοποίηση Όγκου"
      de: "Tumor-Strahlensensibilisierung"
      it: "Radiosensibilizzazione tumorale"
      es: "Radiosensibilización tumoral"
      fr: "Radiosensibilisation tumorale"
    type: "Research"
    typeColor: "orange"
    description:
      en: "Investigational. Hypoxic tumours resist radiotherapy, and HBOT given with radiotherapy has been studied as a way to overcome this. A Cochrane review of 19 trials (2,286 participants) found better local tumour control and lower mortality in head and neck cancer — possibly only with unusual fractionation schemes — but no clear benefit in cervical or bladder cancer, and a significantly higher risk of severe radiation tissue injury and oxygen-toxicity seizures."
      el: "Ερευνητική χρήση. Οι υποξικοί όγκοι αντιστέκονται στην ακτινοθεραπεία, και η HBOT σε συνδυασμό με ακτινοθεραπεία έχει μελετηθεί ως τρόπος υπέρβασης αυτής της αντίστασης. Μια ανασκόπηση Cochrane 19 δοκιμών (2.286 συμμετέχοντες) βρήκε καλύτερο τοπικό έλεγχο του όγκου και χαμηλότερη θνησιμότητα στον καρκίνο κεφαλής και τραχήλου —πιθανώς μόνο με ασυνήθη σχήματα κλασματοποίησης— αλλά κανένα σαφές όφελος στον καρκίνο του τραχήλου της μήτρας ή της ουροδόχου κύστης, και σημαντικά αυξημένο κίνδυνο σοβαρής ακτινικής βλάβης των ιστών και σπασμών από τοξικότητα οξυγόνου."
      de: "Experimentell. Hypoxische Tumoren sind strahlenresistent, und HBOT in Kombination mit Strahlentherapie wurde untersucht, um diese Resistenz zu überwinden. Ein Cochrane-Review von 19 Studien (2.286 Teilnehmende) fand bei Kopf-Hals-Tumoren eine bessere lokale Tumorkontrolle und eine geringere Mortalität — möglicherweise nur bei ungewöhnlichen Fraktionierungsschemata —, jedoch keinen klaren Nutzen bei Zervix- oder Blasenkarzinom sowie ein deutlich erhöhtes Risiko schwerer strahlenbedingter Gewebeschäden und sauerstofftoxischer Krampfanfälle."
      it: "Sperimentale. I tumori ipossici resistono alla radioterapia, e l'HBOT associata alla radioterapia è stata studiata per superare questa resistenza. Una revisione Cochrane di 19 studi (2.286 partecipanti) ha rilevato un migliore controllo locale del tumore e una minore mortalità nei tumori della testa e del collo — forse solo con schemi di frazionamento insoliti — ma nessun beneficio chiaro nel carcinoma della cervice o della vescica, e un rischio significativamente maggiore di gravi danni tissutali da radiazioni e di crisi convulsive da tossicità dell'ossigeno."
      es: "Experimental. Los tumores hipóxicos son resistentes a la radioterapia, y la HBOT asociada a la radioterapia se ha estudiado como forma de superar esta resistencia. Una revisión Cochrane de 19 ensayos (2286 participantes) halló un mejor control local del tumor y una menor mortalidad en el cáncer de cabeza y cuello —posiblemente solo con esquemas de fraccionamiento inusuales—, pero ningún beneficio claro en el cáncer de cuello uterino o de vejiga, y un riesgo significativamente mayor de lesión tisular grave por radiación y de convulsiones por toxicidad del oxígeno."
      fr: "Expérimental. Les tumeurs hypoxiques résistent à la radiothérapie, et l'HBOT administrée avec la radiothérapie a été étudiée comme moyen de surmonter cette résistance. Une revue Cochrane de 19 essais (2 286 participants) a constaté un meilleur contrôle tumoral local et une mortalité plus faible dans les cancers de la tête et du cou — peut-être uniquement avec des schémas de fractionnement inhabituels — mais aucun bénéfice net dans les cancers du col de l'utérus ou de la vessie, ainsi qu'un risque significativement plus élevé de lésions tissulaires radiques sévères et de crises convulsives liées à la toxicité de l'oxygène."

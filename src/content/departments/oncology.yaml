    description:
      en: "Approved adjunctive treatment for radiation-induced hemorrhagic cystitis and proctitis, reducing bleeding and promoting mucosal healing."
      el: "Εγκεκριμένη επικουρική θεραπεία για αιμορραγική κυστίτιδα και πρωκτίτιδα από ακτινοβολία, μειώνοντας αιμορραγία και προάγοντας επούλωση βλεννογόνου."
      de: "Zugelassene adjuvante Therapie bei strahleninduzierter hämorrhagischer Zystitis und Proktitis; reduziert Blutungen und fördert die Schleimhautheilung."
      it: "Trattamento adiuvante approvato per la cistite e la proctite emorragica indotte da radiazioni, che riduce il sanguinamento e promuove la guarigione della mucosa."
      es: "Tratamiento adyuvante aprobado para la cistitis y la proctitis hemorrágica inducidas por radiación, que reduce el sangrado y promueve la cicatrización de la mucosa."

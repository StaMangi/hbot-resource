  - title:
      en: "Tumor Radiosensitization"
      el: "Ακτινοευαισθητοποίηση Όγκου"
      de: "Tumor-Strahlensensibilisierung"
      it: "Radiosensibilizzazione tumorale"
      es: "Radiosensibilización tumoral"
    type: "Research"
    typeColor: "orange"
    description:
      en: "Investigational use as neoadjuvant therapy to sensitize hypoxic solid tumors to radiotherapy and chemotherapy. Hypoxic tumor microenvironments are resistant to radiation; HBOT may reverse this resistance."
      el: "Ερευνητική χρήση ως νεοεπικουρική θεραπεία για ευαισθητοποίηση υποξικών συμπαγών όγκων σε ακτινοθεραπεία και χημειοθεραπεία. Υποξικά μικροπεριβάλλοντα όγκων αντιστέκονται στην ακτινοβολία· η HBOT μπορεί να αντιστρέψει αυτή την αντίσταση."
      de: "Investigative Anwendung als neoadjuvante Therapie zur Sensibilisierung hypoxischer solider Tumoren gegenüber Strahlen- und Chemotherapie. Hypoxische Tumormikromilieus sind strahlenresistent; HBOT kann diese Resistenz umkehren."
      it: "Uso sperimentale come terapia neoadiuvante per sensibilizzare i tumori solidi ipossici alla radioterapia e alla chemioterapia. I microambienti tumorali ipossici sono resistenti alle radiazioni; l'HBOT può invertire questa resistenza."
      es: "Uso experimental como terapia neoadyuvante para sensibilizar los tumores sólidos hipóxicos a la radioterapia y la quimioterapia. Los microambientes tumorales hipóxicos son resistentes a la radiación; la HBOT puede revertir esta resistencia."

applications:
  - title:
      en: "Delayed Radiation Injury"
      el: "Καθυστερημένη Ακτινοβολική Βλάβη"
      de: "Verzögerte Strahlenschäden"
      it: "Danno radiogeno tardivo"
      es: "Lesión por radiación tardía"
    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "Standard-of-care treatment for osteoradionecrosis and soft tissue radiation necrosis. HBOT promotes angiogenesis in hypoxic, hypovascular, hypocellular irradiated tissue."
      el: "Θεραπεία πρότυπου φροντίδας για οστεοακτινονέκρωση και νέκρωση μαλακών ιστών από ακτινοβολία. Η HBOT προάγει αγγειογένεση σε υποξικό, υποαγγειακό, υποκυτταρικό ακτινοβολημένο ιστό."
      de: "Standardtherapie bei Osteoradionekrose und Strahlennekrose des Weichgewebes. HBOT fördert die Angiogenese in hypoxischem, hypovaskulärem, hypozellulärem bestrahltem Gewebe."
      it: "Trattamento standard di cura per l'osteoradionecrosi e la necrosi radiogena dei tessuti molli. L'HBOT promuove l'angiogenesi nel tessuto irradiato ipossico, ipovascolare, ipocellulare."
      es: "Tratamiento estándar de atención para la osteorradionecrosis y la necrosis radiogénica de los tejidos blandos. La HBOT promueve la angiogénesis en el tejido irradiado hipóxico, hipovascular e hipocelular."
    evidence: "Level A"

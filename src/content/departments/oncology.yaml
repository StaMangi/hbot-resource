applications:
  - title:
      en: "Delayed Radiation Injury"
      el: "Καθυστερημένη Ακτινοβολική Βλάβη"
      de: "Verzögerte Strahlenschäden"
      it: "Danno radiogeno tardivo"
      es: "Lesión por radiación tardía"
      fr: "Lésions radiques tardives"
    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "Standard-of-care treatment for osteoradionecrosis and soft tissue radiation necrosis. HBOT promotes angiogenesis in hypoxic, hypovascular, hypocellular irradiated tissue. A 2025 retrospective study of 45 patients with solid tumours treated with HBOT for cancer-treatment complications found no association between the number of sessions and metastasis or mortality."
      el: "Θεραπεία πρότυπου φροντίδας για οστεοακτινονέκρωση και νέκρωση μαλακών ιστών από ακτινοβολία. Η HBOT προάγει αγγειογένεση σε υποξικό, υποαγγειακό, υποκυτταρικό ακτινοβολημένο ιστό. Μια αναδρομική μελέτη του 2025 σε 45 ασθενείς με συμπαγείς όγκους που έλαβαν HBOT για επιπλοκές της αντικαρκινικής θεραπείας δεν βρήκε συσχέτιση μεταξύ του αριθμού των συνεδριών και των μεταστάσεων ή της θνησιμότητας."
      de: "Standardtherapie bei Osteoradionekrose und Strahlennekrose des Weichgewebes. HBOT fördert die Angiogenese in hypoxischem, hypovaskulärem, hypozellulärem bestrahltem Gewebe. Eine retrospektive Studie von 2025 an 45 Patienten mit soliden Tumoren, die wegen Komplikationen der Krebstherapie mit HBOT behandelt wurden, fand keinen Zusammenhang zwischen der Zahl der Sitzungen und Metastasen oder Mortalität."
      it: "Trattamento standard di cura per l'osteoradionecrosi e la necrosi radiogena dei tessuti molli. L'HBOT promuove l'angiogenesi nel tessuto irradiato ipossico, ipovascolare, ipocellulare. Uno studio retrospettivo del 2025 su 45 pazienti con tumori solidi trattati con HBOT per complicanze delle terapie oncologiche non ha rilevato alcuna associazione tra il numero di sedute e metastasi o mortalità."
      es: "Tratamiento estándar de atención para la osteorradionecrosis y la necrosis radiogénica de los tejidos blandos. La HBOT promueve la angiogénesis en el tejido irradiado hipóxico, hipovascular e hipocelular. Un estudio retrospectivo de 2025 en 45 pacientes con tumores sólidos tratados con HBOT por complicaciones del tratamiento oncológico no halló asociación entre el número de sesiones y las metástasis o la mortalidad."
      fr: "Traitement de référence de l'ostéoradionécrose et de la radionécrose des tissus mous. L'HBOT favorise l'angiogenèse dans les tissus irradiés hypoxiques, hypovasculaires et hypocellulaires. Une étude rétrospective de 2025 portant sur 45 patients atteints de tumeurs solides, traités par HBOT pour des complications de traitements anticancéreux, n'a trouvé aucune association entre le nombre de séances et la survenue de métastases ou la mortalité."

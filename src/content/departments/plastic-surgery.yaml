metaDescription:
  en: "Hyperbaric oxygen in plastic and reconstructive surgery — salvage of compromised grafts and flaps, post-procedure recovery and radiation-injury management."
  el: "Υπερβαρική οξυγονοθεραπεία στην πλαστική και επανορθωτική χειρουργική — διάσωση διακυβευμένων μοσχευμάτων και κρημνών, μετεγχειρητική αποκατάσταση και διαχείριση ακτινικής βλάβης."
  de: "Hyperbare Sauerstofftherapie in der plastischen und rekonstruktiven Chirurgie — Rettung kompromittierter Transplantate und Lappen, postoperative Erholung und Behandlung von Strahlenschäden."
  it: "Ossigenoterapia iperbarica in chirurgia plastica e ricostruttiva — salvataggio di innesti e lembi compromessi, recupero post-procedurale e gestione del danno radiogeno."
  es: "Oxigenoterapia hiperbárica en cirugía plástica y reconstructiva — rescate de injertos y colgajos comprometidos, recuperación posprocedimiento y manejo de la lesión radiogénica."

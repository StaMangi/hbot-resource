applications:
  - title:
      en: "Pelvic Radiation Injury"
      el: "Πυελική Ακτινική Κάκωση"
      de: "Strahlenschäden im Beckenbereich"
      it: "Danno radiogeno pelvico"
      es: "Lesión por radiación pélvica"
    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "HBOT for late radiation tissue injury in pelvic structures (radiation cystitis, proctitis, vaginal stenosis) following gynaecological cancer radiotherapy. Cross-references the FDA-approved Delayed Radiation Injury indication; the women's-health context emphasises pelvic-specific manifestations."
      el: "HBOT για όψιμη ακτινική βλάβη ιστών σε πυελικές δομές (ακτινική κυστίτιδα, ορθίτιδα, κολπική στένωση) μετά από ακτινοθεραπεία γυναικολογικού καρκίνου. Παραπέμπει στην εγκεκριμένη από το FDA ένδειξη Καθυστερημένης Ακτινικής Βλάβης· το πλαίσιο της γυναικολογικής υγείας τονίζει τις πυελικά ειδικές εκδηλώσεις."
      de: "HBOT bei späten Strahlengewebsschäden im Beckenbereich (Strahlenzystitis, Proktitis, Scheidenstenose) nach Strahlentherapie bei gynäkologischem Krebs. Verweist auf die FDA-zugelassene Indikation Verzögerte Strahlenschäden; der Kontext der Frauengesundheit betont die beckenspezifischen Manifestationen."
      it: "HBOT per il danno radiogeno tardivo dei tessuti nelle strutture pelviche (cistite radiogena, proctite, stenosi vaginale) dopo radioterapia per cancro ginecologico. Rimanda all'indicazione Danno radiogeno tardivo approvata dalla FDA; il contesto della salute della donna sottolinea le manifestazioni pelviche specifiche."
      es: "HBOT para la lesión tisular tardía por radiación en estructuras pélvicas (cistitis por radiación, proctitis, estenosis vaginal) tras radioterapia por cáncer ginecológico. Remite a la indicación Lesión por radiación tardía aprobada por la FDA; el contexto de la salud de la mujer destaca las manifestaciones específicamente pélvicas."

  - title:
      en: "Endometriosis"
      el: "Ενδομητρίωση"
      de: "Endometriose"
      it: "Endometriosi"
    type: "Emerging Evidence"
    typeColor: "amber"
    description:
      en: "Investigational application supported by translational evidence in rodent models and one registered randomised trial (HEROES, NCT06579040) currently recruiting. No published human clinical evidence yet; HBOT is positioned as an investigational adjunct, not standard of care."
      el: "Ερευνητική εφαρμογή που υποστηρίζεται από μεταγωγικά στοιχεία σε μοντέλα τρωκτικών και μία καταχωρημένη τυχαιοποιημένη δοκιμή (HEROES, NCT06579040) που αυτή τη στιγμή εγγράφει ασθενείς. Δεν υπάρχουν δημοσιευμένα κλινικά στοιχεία σε ανθρώπους ακόμη· η HBOT τοποθετείται ως ερευνητική επικουρική, όχι ως πρότυπο θεραπείας."
      de: "Investigative Anwendung, gestützt durch translationale Evidenz in Nagermodellen und eine registrierte randomisierte Studie (HEROES, NCT06579040), die derzeit Patientinnen einschließt. Noch keine veröffentlichte klinische Evidenz beim Menschen; HBOT wird als investigatives Adjuvans positioniert, nicht als Standardtherapie."
      it: "Applicazione sperimentale supportata da evidenze traslazionali in modelli animali roditori e da uno studio randomizzato registrato (HEROES, NCT06579040) attualmente in fase di reclutamento. Non esistono ancora evidenze cliniche pubblicate sull'uomo; l'HBOT è posizionata come adiuvante sperimentale, non standard di cura."

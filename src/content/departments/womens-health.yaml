metaDescription:
  en: "HBOT in women's health — FDA-approved treatment for pelvic radiation injury and emerging, investigational research in endometriosis."
  el: "HBOT στην υγεία των γυναικών — εγκεκριμένη από το FDA θεραπεία για πυελική ακτινική βλάβη και αναδυόμενη, ερευνητική έρευνα στην ενδομητρίωση."
  de: "HBOT in der Frauengesundheit — FDA-zugelassene Behandlung der Beckenstrahlenschädigung und aufkommende, in Erprobung befindliche Forschung bei Endometriose."
  it: "HBOT nella salute della donna — trattamento approvato dalla FDA per il danno radiogeno pelvico e ricerca emergente e sperimentale sull'endometriosi."
  es: "HBOT en salud de la mujer — tratamiento aprobado por la FDA para la lesión radiogénica pélvica e investigación emergente e investigacional en endometriosis."

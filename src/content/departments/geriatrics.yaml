shortDesc:
  en: "Physical Performance, Cognitive Aging"
  el: "Φυσική Απόδοση, Γνωστική Γήρανση"
  de: "Körperliche Leistungsfähigkeit, kognitives Altern"
  it: "Prestazione fisica, invecchiamento cognitivo"
  es: "Rendimiento físico, envejecimiento cognitivo"
applications:
  - title:
      en: "Physical Performance Enhancement"
      el: "Ενίσχυση Φυσικής Απόδοσης"
      de: "Verbesserung der körperlichen Leistungsfähigkeit"
      it: "Miglioramento della prestazione fisica"
      es: "Mejora del rendimiento físico"
    type: "Research"
    typeColor: "blue"
    description:
      en: "Randomized controlled trial demonstrated HBOT improves maximal physical performance and cardiac perfusion in sedentary older adults, enhancing exercise capacity and cardiovascular function."
      el: "Τυχαιοποιημένη ελεγχόμενη δοκιμή απέδειξε ότι η HBOT βελτιώνει μέγιστη φυσική απόδοση και καρδιακή αιμάτωση σε καθιστικούς ηλικιωμένους, ενισχύοντας ικανότητα άσκησης και καρδιαγγειακή λειτουργία."
      de: "Eine randomisierte kontrollierte Studie zeigte, dass HBOT die maximale körperliche Leistungsfähigkeit und die kardiale Perfusion bei sitzend lebenden älteren Erwachsenen verbessert und so die Belastbarkeit und die kardiovaskuläre Funktion steigert."
      it: "Uno studio clinico randomizzato controllato (RCT) ha dimostrato che l'HBOT migliora la prestazione fisica massimale e la perfusione cardiaca negli anziani sedentari, potenziando la capacità di esercizio e la funzione cardiovascolare."
      es: "Un ensayo clínico aleatorizado (ECA) demostró que la HBOT mejora el rendimiento físico máximo y la perfusión cardiaca en adultos mayores sedentarios, potenciando la capacidad de ejercicio y la función cardiovascular."
    evidence: "Level A (RCT)"

applications:
  - title:
      en: "Mild Traumatic Brain Injury (mTBI)"
      el: "Ήπια Κρανιοεγκεφαλική Κάκωση (ΗΚΕ)"
      de: "Leichtes Schädel-Hirn-Trauma (mSHT)"
    type: "Research"
    typeColor: "blue"
    description:
      en: "B-level evidence from clinical trials demonstrating improvements in neurocognitive deficits, post-concussion symptoms, and brain microstructure in mTBI patients."
      el: "Τεκμηρίωση επιπέδου Β από κλινικές δοκιμές που αποδεικνύουν βελτιώσεις σε νευρογνωστικά ελλείμματα, συμπτώματα μετά από διάσειση και μικροδομή εγκεφάλου σε ασθενείς με ΗΚΕ."
      de: "Evidenz Stufe B aus klinischen Studien, die Verbesserungen neurokognitiver Defizite, postkommotioneller Symptome und der Hirn-Mikrostruktur bei Patienten mit leichtem SHT belegen."
    evidence: "Level B"
    protocol:
      ata:
        en: "1.5 – 2.0 ATA"
        el: "1.5 – 2.0 ATA"
        de: "1.5 – 2.0 ATA"
      duration:
        en: "60 – 90 min"
        el: "60 – 90 min"
        de: "60 – 90 min"
      sessions:
        en: "40 – 60"
        el: "40 – 60"
        de: "40 – 60"
      frequency:
        en: "Once daily, 5×/week"
        el: "Μία φορά την ημέρα, 5×/εβδομάδα"
        de: "Einmal täglich, 5×/Woche"
      basis:
        en: "Level B Evidence"
        el: "Τεκμηρίωση Επιπέδου Β"
        de: "Evidenz Stufe B"

  - title:
      en: "Vascular Dementia"
      el: "Αγγειακή Άνοια"
      de: "Vaskuläre Demenz"
    type: "Research"
    typeColor: "blue"
    description:
      en: "HBOT reverses chronic cerebral hypoperfusion and promotes angiogenesis in brain tissue. Clinical studies show improvements in cognitive function in vascular dementia patients."
      el: "Η HBOT αντιστρέφει χρόνια εγκεφαλική υποαιμάτωση και προάγει αγγειογένεση σε εγκεφαλικό ιστό. Κλινικές μελέτες δείχνουν βελτιώσεις σε γνωστική λειτουργία σε ασθενείς με αγγειακή άνοια."
      de: "HBOT kehrt die chronische zerebrale Minderperfusion um und fördert die Angiogenese im Hirngewebe. Klinische Studien zeigen Verbesserungen der kognitiven Funktion bei Patienten mit vaskulärer Demenz."
    evidence: "Level B"
    protocol:
      ata:
        en: "2.0 ATA"
        el: "2.0 ATA"
        de: "2.0 ATA"
      duration:
        en: "90 min"
        el: "90 min"
        de: "90 min"
      sessions:
        en: "60"
        el: "60"
        de: "60"
      frequency:
        en: "Once daily, 5×/week"
        el: "Μία φορά την ημέρα, 5×/εβδομάδα"
        de: "Einmal täglich, 5×/Woche"
      basis:
        en: "Clinical Research"
        el: "Κλινική Έρευνα"
        de: "Klinische Forschung"

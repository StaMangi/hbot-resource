      de: "Evidenz Stufe B aus klinischen Studien, die Verbesserungen neurokognitiver Defizite, postkommotioneller Symptome und der Hirn-Mikrostruktur bei Patienten mit leichtem SHT belegen."
      it: "Evidenza di Livello B da studi clinici che dimostrano miglioramenti nei deficit neurocognitivi, nei sintomi post-commozione cerebrale e nella microstruttura cerebrale nei pazienti con mTBI."

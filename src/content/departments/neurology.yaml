      it: "Evidenze emergenti precliniche e cliniche iniziali per la malattia di Alzheimer e la malattia di Parkinson. L'HBOT riduce la neuroinfiammazione e promuove la neurogenesi."
      es: "Evidencia emergente preclínica y clínica inicial para la enfermedad de Alzheimer y la enfermedad de Parkinson. La HBOT reduce la neuroinflamación y promueve la neurogénesis."
      fr: "Données émergentes précliniques et cliniques préliminaires dans la maladie d'Alzheimer et la maladie de Parkinson. L'HBOT réduit la neuro-inflammation et favorise la neurogenèse."

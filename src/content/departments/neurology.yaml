  - title:
      en: "Fibromyalgia"
      el: "Ινομυαλγία"
      de: "Fibromyalgie"
      it: "Fibromialgia"
    type: "Emerging Evidence"
    typeColor: "amber"
    description:
      en: "Chronic central sensitisation syndrome with widespread pain, tender points, fatigue, sleep disturbance, and cognitive symptoms. A 2015 prospective controlled trial reported significant improvements after 40 HBOT sessions at 2.0 ATA, with two independent 2023 meta-analyses confirming improvements in function, tender points, fatigue, sleep, and quality of life across pooled randomised data."
      el: "Σύνδρομο χρόνιας κεντρικής ευαισθητοποίησης με εκτεταμένο πόνο, ευαίσθητα σημεία, κόπωση, διαταραχές ύπνου και γνωστικά συμπτώματα. Προοπτική ελεγχόμενη δοκιμή του 2015 ανέφερε σημαντικές βελτιώσεις μετά από 40 συνεδρίες HBOT στα 2.0 ATA, με δύο ανεξάρτητες μετα-αναλύσεις του 2023 να επιβεβαιώνουν βελτιώσεις σε λειτουργικότητα, ευαίσθητα σημεία, κόπωση, ύπνο και ποιότητα ζωής σε συγκεντρωτικά τυχαιοποιημένα δεδομένα."
      de: "Chronisches zentrales Sensibilisierungssyndrom mit weitverbreiteten Schmerzen, Tender Points, Fatigue, Schlafstörungen und kognitiven Symptomen. Eine prospektive kontrollierte Studie von 2015 berichtete über signifikante Verbesserungen nach 40 HBOT-Sitzungen bei 2,0 ATA; zwei unabhängige Meta-Analysen aus 2023 bestätigen Verbesserungen bei Funktion, Tender Points, Fatigue, Schlaf und Lebensqualität über gepoolte randomisierte Daten hinweg."
      it: "Sindrome cronica da sensibilizzazione centrale con dolore diffuso, tender points, affaticamento, disturbi del sonno e sintomi cognitivi. Uno studio controllato prospettico del 2015 ha riportato miglioramenti significativi dopo 40 sedute di HBOT a 2.0 ATA, con due metanalisi indipendenti del 2023 che confermano miglioramenti in funzione, tender points, affaticamento, sonno e qualità della vita su dati randomizzati aggregati."
    evidence: "Level B"

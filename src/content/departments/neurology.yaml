  - title:
      en: "Long COVID"
      el: "Long COVID"
      de: "Long COVID"
    type: "Emerging Evidence"
    typeColor: "amber"
    description:
      en: "Persistent cognitive dysfunction, brain fog, fatigue, sleep disturbance, and pain following SARS-CoV-2 infection. A randomised controlled trial reported significant improvements after 40 HBOT sessions, with benefits sustained at one-year follow-up. Evidence currently anchored to a single research group; independent replication ongoing."
      el: "Επίμονη γνωστική δυσλειτουργία, brain fog, κόπωση, διαταραχές ύπνου και πόνος μετά από λοίμωξη SARS-CoV-2. Τυχαιοποιημένη ελεγχόμενη δοκιμή ανέφερε σημαντική βελτίωση μετά από 40 συνεδρίες HBOT, με τα οφέλη να διατηρούνται σε παρακολούθηση ενός έτους. Η τεκμηρίωση βασίζεται προς το παρόν σε μία ερευνητική ομάδα — ανεξάρτητη επιβεβαίωση εκκρεμεί."
      de: "Anhaltende kognitive Dysfunktion, Brain Fog, Fatigue, Schlafstörungen und Schmerzen nach SARS-CoV-2-Infektion. Eine randomisierte kontrollierte Studie berichtete über signifikante Verbesserungen nach 40 HBOT-Sitzungen, wobei die Vorteile bei einer Nachbeobachtung über ein Jahr anhielten. Die Evidenz stützt sich derzeit auf eine einzelne Forschungsgruppe; eine unabhängige Replikation steht aus."
    evidence: "Level B"
    protocol:
      ata:
        en: "2.0 ATA"
        el: "2.0 ATA"
        de: "2.0 ATA"
      duration:
        en: "90 min"
        el: "90 min"
        de: "90 min"
      sessions:
        en: "40"
        el: "40"
        de: "40"
      frequency:
        en: "5×/week"
        el: "5×/εβδομάδα"
        de: "5×/Woche"
      basis:
        en: "RCT (Zilberman-Itskovich et al., 2022)"
        el: "ΤΕΔ (Zilberman-Itskovich et al., 2022)"
        de: "RKS (Zilberman-Itskovich et al., 2022)"
    refs:
      - "[25]"
      - "[26]"
      - "[27]"
      - "[28]"
  - title:
      en: "Fibromyalgia"
      el: "Ινομυαλγία"
      de: "Fibromyalgie"
    type: "Emerging Evidence"
    typeColor: "amber"
    description:
      en: "Chronic central sensitisation syndrome with widespread pain, tender points, fatigue, sleep disturbance, and cognitive symptoms. A 2015 prospective controlled trial reported significant improvements after 40 HBOT sessions at 2.0 ATA, with two independent 2023 meta-analyses confirming improvements in function, tender points, fatigue, sleep, and quality of life across pooled randomised data."
      el: "Σύνδρομο χρόνιας κεντρικής ευαισθητοποίησης με εκτεταμένο πόνο, ευαίσθητα σημεία, κόπωση, διαταραχές ύπνου και γνωστικά συμπτώματα. Προοπτική ελεγχόμενη δοκιμή του 2015 ανέφερε σημαντικές βελτιώσεις μετά από 40 συνεδρίες HBOT στα 2.0 ATA, με δύο ανεξάρτητες μετα-αναλύσεις του 2023 να επιβεβαιώνουν βελτιώσεις σε λειτουργικότητα, ευαίσθητα σημεία, κόπωση, ύπνο και ποιότητα ζωής σε συγκεντρωτικά τυχαιοποιημένα δεδομένα."
      de: "Chronisches zentrales Sensibilisierungssyndrom mit weitverbreiteten Schmerzen, Tender Points, Fatigue, Schlafstörungen und kognitiven Symptomen. Eine prospektive kontrollierte Studie von 2015 berichtete über signifikante Verbesserungen nach 40 HBOT-Sitzungen bei 2,0 ATA; zwei unabhängige Meta-Analysen aus 2023 bestätigen Verbesserungen bei Funktion, Tender Points, Fatigue, Schlaf und Lebensqualität über gepoolte randomisierte Daten hinweg."
    evidence: "Level B"
    protocol:
      ata:
        en: "2.0 ATA"
        el: "2.0 ATA"
        de: "2.0 ATA"
      duration:
        en: "90 min"
        el: "90 min"
        de: "90 min"
      sessions:
        en: "40"
        el: "40"
        de: "40"
      frequency:
        en: "5×/week"
        el: "5×/εβδομάδα"
        de: "5×/Woche"
      basis:
        en: "Prospective Controlled Trial (Efrati et al., 2015)"
        el: "Προοπτική Ελεγχόμενη Δοκιμή (Efrati et al., 2015)"
        de: "Prospektive Kontrollierte Studie (Efrati et al., 2015)"

  - title:
      en: "Long COVID"
      el: "Long COVID"
      de: "Long COVID"
      it: "Long COVID (Sindrome post-COVID)"
    type: "Emerging Evidence"
    typeColor: "amber"
    description:
      en: "Persistent cognitive dysfunction, brain fog, fatigue, sleep disturbance, and pain following SARS-CoV-2 infection. A randomised controlled trial reported significant improvements after 40 HBOT sessions, with benefits sustained at one-year follow-up. Evidence currently anchored to a single research group; independent replication ongoing."
      el: "Επίμονη γνωστική δυσλειτουργία, brain fog, κόπωση, διαταραχές ύπνου και πόνος μετά από λοίμωξη SARS-CoV-2. Τυχαιοποιημένη ελεγχόμενη δοκιμή ανέφερε σημαντική βελτίωση μετά από 40 συνεδρίες HBOT, με τα οφέλη να διατηρούνται σε παρακολούθηση ενός έτους. Η τεκμηρίωση βασίζεται προς το παρόν σε μία ερευνητική ομάδα — ανεξάρτητη επιβεβαίωση εκκρεμεί."
      de: "Anhaltende kognitive Dysfunktion, Brain Fog, Fatigue, Schlafstörungen und Schmerzen nach SARS-CoV-2-Infektion. Eine randomisierte kontrollierte Studie berichtete über signifikante Verbesserungen nach 40 HBOT-Sitzungen, wobei die Vorteile bei einer Nachbeobachtung über ein Jahr anhielten. Die Evidenz stützt sich derzeit auf eine einzelne Forschungsgruppe; eine unabhängige Replikation steht aus."
      it: "Disfunzione cognitiva persistente, brain fog, affaticamento, disturbi del sonno e dolore dopo infezione da SARS-CoV-2. Uno studio clinico randomizzato controllato (RCT) ha riportato miglioramenti significativi dopo 40 sedute di HBOT, con benefici mantenuti al follow-up a un anno. L'evidenza è attualmente ancorata a un singolo gruppo di ricerca; è in corso una replicazione indipendente."
    evidence: "Level B"

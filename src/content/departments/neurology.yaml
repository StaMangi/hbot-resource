  - title:
      en: "Mild Traumatic Brain Injury (mTBI)"
      el: "Ήπια Κρανιοεγκεφαλική Κάκωση (ΗΚΕ)"
      de: "Leichtes Schädel-Hirn-Trauma (mSHT)"
      it: "Trauma cranico lieve (mTBI)"
      es: "Traumatismo craneoencefálico leve (mTBI)"
      fr: "Traumatisme crânien léger (TCL)"
    type: "Research"
    typeColor: "blue"
    description:
      en: "B-level evidence from clinical trials demonstrating improvements in neurocognitive deficits, post-concussion symptoms, and brain microstructure in mTBI patients."
      el: "Τεκμηρίωση επιπέδου Β από κλινικές δοκιμές που αποδεικνύουν βελτιώσεις σε νευρογνωστικά ελλείμματα, συμπτώματα μετά από διάσειση και μικροδομή εγκεφάλου σε ασθενείς με ΗΚΕ."
      de: "Evidenz Stufe B aus klinischen Studien, die Verbesserungen neurokognitiver Defizite, postkommotioneller Symptome und der Hirn-Mikrostruktur bei Patienten mit leichtem SHT belegen."
      it: "Evidenza di Livello B da studi clinici che dimostrano miglioramenti nei deficit neurocognitivi, nei sintomi post-commozione cerebrale e nella microstruttura cerebrale nei pazienti con mTBI."
      es: "Evidencia de Nivel B procedente de ensayos clínicos que demuestran mejoras en los déficits neurocognitivos, los síntomas posconmoción cerebral y la microestructura cerebral en pacientes con mTBI."
      fr: "Données de niveau B issues d'essais cliniques démontrant des améliorations des déficits neurocognitifs, des symptômes post-commotionnels et de la microstructure cérébrale chez les patients atteints de TCL."

    description:
      en: "Approved for acute traumatic ischemias. Reduces post-ischemic edema and preserves threatened tissue in severe crush injuries."
      el: "Εγκεκριμένη για οξείες τραυματικές ισχαιμίες. Μειώνει μετα-ισχαιμικό οίδημα και διατηρεί απειλούμενο ιστό σε σοβαρές κακώσεις σύνθλιψης."
      de: "Zugelassen bei akuten traumatischen Ischämien. Reduziert post-ischämische Ödeme und erhält gefährdetes Gewebe bei schweren Quetschverletzungen."
      it: "Approvata per le ischemie traumatiche acute. Riduce l'edema post-ischemico e preserva il tessuto a rischio nelle lesioni da schiacciamento gravi."
      es: "Aprobada para las isquemias traumáticas agudas. Reduce el edema posisquémico y preserva el tejido en riesgo en las lesiones por aplastamiento graves."
      fr: "Approuvée dans les ischémies traumatiques aiguës. Réduit l'œdème post-ischémique et préserve les tissus menacés dans les écrasements graves."

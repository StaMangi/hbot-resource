applications:
  - title:
      en: "Refractory Osteomyelitis"
      el: "Ανθεκτική Οστεομυελίτιδα"
      de: "Refraktäre Osteomyelitis"
      it: "Osteomielite refrattaria"
      es: "Osteomielitis refractaria"
      fr: "Ostéomyélite réfractaire"
    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "Standard-of-care adjunctive treatment for chronic osteomyelitis unresponsive to conventional therapy. HBOT enhances leukocyte killing in avascular bone and promotes neovascularization."
      el: "Επικουρική θεραπεία πρότυπου φροντίδας για χρόνια οστεομυελίτιδα μη ανταποκρινόμενη σε συμβατική θεραπεία. Η HBOT ενισχύει λευκοκυτταρική θανάτωση σε αναίμακτο οστό και προάγει νεοαγγείωση."
      de: "Adjuvante Standardtherapie bei chronischer Osteomyelitis, die auf konventionelle Therapie nicht anspricht. HBOT verstärkt die Leukozyten-Abtötung in avaskulärem Knochen und fördert die Neovaskularisation."
      it: "Trattamento adiuvante standard di cura per l'osteomielite cronica non responsiva alla terapia convenzionale. L'HBOT potenzia l'azione battericida dei leucociti nell'osso avascolare e promuove la neovascolarizzazione."
      es: "Tratamiento adyuvante estándar de atención para la osteomielitis crónica que no responde a la terapia convencional. La HBOT potencia la acción bactericida de los leucocitos en el hueso avascular y promueve la neovascularización."
      fr: "Traitement adjuvant de référence de l'ostéomyélite chronique ne répondant pas aux traitements conventionnels. L'HBOT renforce l'activité bactéricide des leucocytes dans l'os avasculaire et favorise la néovascularisation."

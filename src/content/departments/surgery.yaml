  - title:
      en: "Therapeutic Angiogenesis (Cardiac)"
      el: "Θεραπευτική Αγγειογένεση (Καρδιακή)"
      de: "Therapeutische Angiogenese (kardial)"
    type: "Research"
    typeColor: "blue"
    description:
      en: "Investigational use for chronic stable ischemic heart disease and post-MI left ventricular function improvement through VEGF-mediated angiogenesis."
      el: "Ερευνητική χρήση για χρόνια σταθερή ισχαιμική καρδιοπάθεια και βελτίωση λειτουργίας αριστερής κοιλίας μετά από ΕΜ μέσω αγγειογένεσης μεσολαβούμενης από VEGF."
      de: "Investigative Anwendung bei chronischer stabiler ischämischer Herzkrankheit und Verbesserung der linksventrikulären Funktion nach Myokardinfarkt durch VEGF-vermittelte Angiogenese."
    evidence: "Level C"
    protocol:

      de: "Zugelassen bei akuten traumatischen Ischämien. Reduziert post-ischämische Ödeme und erhält gefährdetes Gewebe bei schweren Quetschverletzungen."
      it: "Approvata per le ischemie traumatiche acute. Riduce l'edema post-ischemico e preserva il tessuto a rischio nelle lesioni da schiacciamento gravi."

  de: "Orthopädie, Plastische, Herz-Thorax-, Gefäßchirurgie"
applications:
  - title:
      en: "Refractory Osteomyelitis"
      el: "Ανθεκτική Οστεομυελίτιδα"
      de: "Refraktäre Osteomyelitis"
    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "Standard-of-care adjunctive treatment for chronic osteomyelitis unresponsive to conventional therapy. HBOT enhances leukocyte killing in avascular bone and promotes neovascularization."
      el: "Επικουρική θεραπεία πρότυπου φροντίδας για χρόνια οστεομυελίτιδα μη ανταποκρινόμενη σε συμβατική θεραπεία. Η HBOT ενισχύει λευκοκυτταρική θανάτωση σε αναίμακτο οστό και προάγει νεοαγγείωση."
      de: "Adjuvante Standardtherapie bei chronischer Osteomyelitis, die auf konventionelle Therapie nicht anspricht. HBOT verstärkt die Leukozyten-Abtötung in avaskulärem Knochen und fördert die Neovaskularisation."
    evidence: "Level A"
    protocol:
      ata: "2.0 – 2.4 ATA"
      duration: "90 min"
      sessions:
        en: "30 – 60"
        el: "30 – 60"
        de: "30 – 60"
      frequency:
        en: "Once daily, 5×/week"
        el: "Μία φορά την ημέρα, 5×/εβδομάδα"
        de: "Einmal täglich, 5×/Woche"
      basis:
        en: "UHMS / FDA-Approved"
        el: "UHMS / FDA-Εγκεκριμένο"
        de: "UHMS / FDA-zugelassen"
    refs:
      - "[9]"
  - title:
      en: "Crush Injuries & Compartment Syndrome"
      el: "Κακώσεις Σύνθλιψης & Σύνδρομο Διαμερίσματος"
      de: "Quetschverletzungen & Kompartmentsyndrom"
    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "Approved for acute traumatic ischemias. Reduces post-ischemic edema and preserves threatened tissue in severe crush injuries."
      el: "Εγκεκριμένη για οξείες τραυματικές ισχαιμίες. Μειώνει μετα-ισχαιμικό οίδημα και διατηρεί απειλούμενο ιστό σε σοβαρές κακώσεις σύνθλιψης."
      de: "Zugelassen bei akuten traumatischen Ischämien. Reduziert post-ischämische Ödeme und erhält gefährdetes Gewebe bei schweren Quetschverletzungen."
    evidence: "Level A"
    protocol:
      ata: "2.0 – 2.4 ATA"
      duration: "90 min"
      sessions:
        en: "10 – 20"
        el: "10 – 20"
        de: "10 – 20"
      frequency:
        en: "Once daily, 5×/week"
        el: "Μία φορά την ημέρα, 5×/εβδομάδα"
        de: "Einmal täglich, 5×/Woche"
      basis:
        en: "UHMS / FDA-Approved"
        el: "UHMS / FDA-Εγκεκριμένο"
        de: "UHMS / FDA-zugelassen"
    refs:
      - "[9]"
  - title:
      en: "Compromised Skin Grafts & Flaps"
      el: "Επικινδυνεύοντα Δερματικά Μοσχεύματα & Κρημνοί"
      de: "Gefährdete Hauttransplantate & Lappen"
    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "Salvage therapy for ischemic reconstructive flaps and skin grafts. Reduces hypoxic necrosis through enhanced tissue oxygenation and angiogenesis."
      el: "Σωτήρια θεραπεία για ισχαιμικούς ανακατασκευαστικούς κρημνούς και δερματικά μοσχεύματα. Μειώνει υποξική νέκρωση μέσω ενισχυμένης οξυγόνωσης ιστών και αγγειογένεσης."
      de: "Salvage-Therapie bei ischämischen rekonstruktiven Lappen und Hauttransplantaten. Reduziert die hypoxische Nekrose durch verbesserte Gewebsoxygenierung und Angiogenese."
    evidence: "Level B"
    protocol:
      ata: "2.0 – 2.4 ATA"
      duration: "90 min"
      sessions:
        en: "20 – 30"
        el: "20 – 30"
        de: "20 – 30"
      frequency:
        en: "Once daily, 5×/week"
        el: "Μία φορά την ημέρα, 5×/εβδομάδα"
        de: "Einmal täglich, 5×/Woche"
      basis:
        en: "UHMS / FDA-Approved"
        el: "UHMS / FDA-Εγκεκριμένο"
        de: "UHMS / FDA-zugelassen"
    refs:
      - "[9]"
  - title:
      en: "Postoperative Recovery (TKA)"
      el: "Μετεγχειρητική Αποκατάσταση (ΟΑΓ)"
      de: "Postoperative Erholung (Knie-TEP)"
    type: "Research"
    typeColor: "blue"
    description:
      en: "Emerging evidence shows HBOT accelerates recovery and reduces muscle damage following total knee arthroplasty and major orthopedic procedures."
      el: "Αναδυόμενα στοιχεία δείχνουν ότι η HBOT επιταχύνει αποκατάσταση και μειώνει μυϊκή βλάβη μετά από ολική αρθροπλαστική γόνατος και μεγάλες ορθοπεδικές επεμβάσεις."
      de: "Aufkommende Evidenz zeigt, dass HBOT die Erholung beschleunigt und Muskelschäden nach Knie-Totalendoprothese (TEP) und größeren orthopädischen Eingriffen reduziert."
    evidence: "Level B"
    protocol:
      ata: "2.0 ATA"
      duration: "90 min"
      sessions:
        en: "10 – 20"
        el: "10 – 20"
        de: "10 – 20"
      frequency:
        en: "Once daily, 5×/week"
        el: "Μία φορά την ημέρα, 5×/εβδομάδα"
        de: "Einmal täglich, 5×/Woche"
      basis:
        en: "Clinical Research"
        el: "Κλινική Έρευνα"
        de: "Klinische Forschung"
    refs:
      - "[10]"
  - title:
      en: "Thermal Burns"
      el: "Θερμικά Εγκαύματα"
      de: "Thermische Verbrennungen"
    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "Adjunctive treatment for acute thermal burns. Reduces edema, promotes epithelialization, and decreases infection risk."
      el: "Επικουρική θεραπεία για οξεία θερμικά εγκαύματα. Μειώνει οίδημα, προάγει επιθηλιοποίηση και μειώνει κίνδυνο λοίμωξης."
      de: "Adjuvante Behandlung akuter thermischer Verbrennungen. Reduziert Ödeme, fördert die Epithelialisierung und verringert das Infektionsrisiko."
    evidence: "Level B"
    protocol:
      ata: "2.0 – 2.4 ATA"
      duration: "90 min"
      sessions:
        en: "20 – 30"
        el: "20 – 30"

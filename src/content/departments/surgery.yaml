      el: "Ερευνητική χρήση για χρόνια σταθερή ισχαιμική καρδιοπάθεια και βελτίωση λειτουργίας αριστερής κοιλίας μετά από ΕΜ μέσω αγγειογένεσης μεσολαβούμενης από VEGF."

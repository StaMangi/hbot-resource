  - title:
      en: "Traumatic Brain Injury / Post-Concussion Recovery"
      el: "Κρανιοεγκεφαλική Κάκωση / Μετα-διασειστική Αποκατάσταση"
      de: "Schädel-Hirn-Trauma / Postkommotionelle Genesung"
      it: "Trauma cranico-encefalico / Recupero post-commozione"
      es: "Traumatismo craneoencefálico / Recuperación post-conmoción"
    type: "Research"
    typeColor: "orange"
    description:
      en: "Evidence is mixed. Chronic-phase trials report benefit: a crossover RCT in adults with prolonged post-concussion syndrome 1–5 years after mild TBI showed cognitive and quality-of-life improvement with SPECT correlates (Boussi-Gross 2013), and a sham-controlled, double-blind RCT in children with persistent post-concussion syndrome showed cognitive and behavioural improvement with MRI microstructural correlates (Hadanny 2022). However, sham-controlled trials in military personnel with mild TBI found HBOT and a low-pressure-air control improving similarly, without a clear HBOT-specific benefit (Walker/Cifu 2014), and a critical appraisal argues the apparent effect may reflect a participation effect, amid unresolved debate over whether the low-pressure \"sham\" is itself biologically active (Bennett 2018). Investigational; not FDA-approved."
      el: "Τα στοιχεία είναι ανάμικτα. Δοκιμές χρόνιας φάσης αναφέρουν όφελος: μια διασταυρούμενη ΤΕΔ σε ενήλικες με παρατεταμένο μετα-διασειστικό σύνδρομο 1–5 έτη μετά από ήπια ΚΕΚ έδειξε βελτίωση της γνωστικής λειτουργίας και της ποιότητας ζωής με συσχετίσεις SPECT (Boussi-Gross 2013), και μια εικονικά ελεγχόμενη (sham), διπλά τυφλή ΤΕΔ σε παιδιά με επίμονο μετα-διασειστικό σύνδρομο έδειξε γνωστική και συμπεριφορική βελτίωση με μικροδομικές συσχετίσεις σε MRI (Hadanny 2022). Ωστόσο, εικονικά ελεγχόμενες δοκιμές σε στρατιωτικό προσωπικό με ήπια ΚΕΚ διαπίστωσαν ότι η HBOT και ένας μάρτυρας αέρα χαμηλής πίεσης βελτιώνονταν παρόμοια, χωρίς σαφές ειδικό για την HBOT όφελος (Walker/Cifu 2014), και μια κριτική αξιολόγηση υποστηρίζει ότι το φαινομενικό αποτέλεσμα μπορεί να αντανακλά φαινόμενο συμμετοχής, εν μέσω άλυτης συζήτησης για το αν η εικονική θεραπεία χαμηλής πίεσης είναι η ίδια βιολογικά ενεργή (Bennett 2018). Ερευνητική· δεν είναι εγκεκριμένη από το FDA."
      de: "Die Evidenz ist gemischt. Studien der chronischen Phase berichten über Nutzen: eine Crossover-RKS bei Erwachsenen mit anhaltendem Postkommotionssyndrom 1–5 Jahre nach leichtem SHT zeigte eine Verbesserung von Kognition und Lebensqualität mit SPECT-Korrelaten (Boussi-Gross 2013), und eine scheinkontrollierte, doppelblinde RKS bei Kindern mit persistierendem Postkommotionssyndrom zeigte eine kognitive und verhaltensbezogene Verbesserung mit mikrostrukturellen MRT-Korrelaten (Hadanny 2022). Allerdings fanden scheinkontrollierte Studien bei Militärangehörigen mit leichtem SHT, dass sich HBOT und eine Niederdruck-Luft-Kontrolle ähnlich verbesserten, ohne einen klaren HBOT-spezifischen Nutzen (Walker/Cifu 2014), und eine kritische Bewertung argumentiert, dass der scheinbare Effekt einen Teilnahmeeffekt widerspiegeln könnte, inmitten einer ungelösten Debatte darüber, ob die Niederdruck-„Schein\"-Behandlung selbst biologisch aktiv ist (Bennett 2018). Experimentell; nicht von der FDA zugelassen."
      it: "Le evidenze sono contrastanti. Studi in fase cronica riportano un beneficio: un RCT crossover in adulti con sindrome post-commozione prolungata 1–5 anni dopo un trauma cranico lieve ha mostrato un miglioramento cognitivo e della qualità della vita con correlati SPECT (Boussi-Gross 2013), e un RCT in doppio cieco controllato con sham in bambini con sindrome post-commozione persistente ha mostrato un miglioramento cognitivo e comportamentale con correlati microstrutturali alla risonanza magnetica (Hadanny 2022). Tuttavia, studi controllati con sham in personale militare con trauma cranico lieve hanno rilevato che l'HBOT e un controllo ad aria a bassa pressione miglioravano in modo simile, senza un chiaro beneficio specifico dell'HBOT (Walker/Cifu 2014), e una valutazione critica sostiene che l'effetto apparente possa riflettere un effetto di partecipazione, in un dibattito irrisolto sul fatto che lo \"sham\" a bassa pressione sia esso stesso biologicamente attivo (Bennett 2018). Sperimentale; non approvata dalla FDA."
      es: "La evidencia es contradictoria. Los ensayos en fase crónica notifican beneficio: un ECA cruzado en adultos con síndrome post-conmoción prolongado 1–5 años tras un traumatismo craneoencefálico leve mostró mejora cognitiva y de la calidad de vida con correlatos en SPECT (Boussi-Gross 2013), y un ECA doble ciego controlado con simulación (sham) en niños con síndrome post-conmoción persistente mostró mejora cognitiva y conductual con correlatos microestructurales en RM (Hadanny 2022). Sin embargo, ensayos controlados con simulación en personal militar con traumatismo craneoencefálico leve hallaron que la HBOT y un control de aire a baja presión mejoraban de forma similar, sin un beneficio claro específico de la HBOT (Walker/Cifu 2014), y una evaluación crítica sostiene que el efecto aparente podría reflejar un efecto de participación, en medio de un debate no resuelto sobre si la \"simulación\" a baja presión es en sí misma biológicamente activa (Bennett 2018). Experimental; no aprobada por la FDA."

  - title:
      en: "Inflammatory Dermatoses"
      el: "Φλεγμονώδεις Δερματοπάθειες"
      de: "Entzündliche Dermatosen"
      it: "Dermatosi infiammatorie"
      es: "Dermatosis inflamatorias"
    type: "Emerging Evidence"
    typeColor: "amber"
    description:
      en: "Case-level and small-cohort evidence in atopic dermatitis (2025 review + paediatric study) and psoriasis (2009 case reports). Other inflammatory conditions (hidradenitis suppurativa, livedoid vasculopathy, pyoderma gangrenosum) have early-stage clinical reports but lack robust trials. HBOT is positioned as adjunctive, not first-line."
      el: "Στοιχεία επιπέδου περιπτώσεων και μικρών ομάδων σε ατοπική δερματίτιδα (ανασκόπηση 2025 + παιδιατρική μελέτη) και ψωρίαση (αναφορές περιπτώσεων 2009). Άλλες φλεγμονώδεις παθήσεις (πυώδης ιδρωταδενίτιδα, λιβεδοειδής αγγειοπάθεια, γαγγραινώδες πυόδερμα) έχουν πρώιμες κλινικές αναφορές αλλά στερούνται ισχυρών δοκιμών. Η HBOT τοποθετείται ως επικουρική, όχι πρώτης γραμμής."
      de: "Evidenz auf Fall- und Kleinkohorten-Ebene bei atopischer Dermatitis (Übersichtsarbeit 2025 + pädiatrische Studie) und Psoriasis (Fallberichte 2009). Weitere entzündliche Erkrankungen (Hidradenitis suppurativa, livedoide Vaskulopathie, Pyoderma gangraenosum) verfügen über frühe klinische Berichte, jedoch fehlen robuste Studien. HBOT wird als adjuvante, nicht als Erstlinientherapie positioniert."
      it: "Evidenze a livello di casi clinici e piccole coorti nella dermatite atopica (revisione 2025 + studio pediatrico) e nella psoriasi (casi clinici 2009). Altre condizioni infiammatorie (idrosadenite suppurativa, vasculopatia livedoide, pioderma gangrenoso) dispongono di segnalazioni cliniche in fase iniziale ma mancano di studi solidi. L'HBOT è posizionata come adiuvante, non di prima linea."
      es: "Evidencia a nivel de casos clínicos y pequeñas cohortes en la dermatitis atópica (revisión de 2025 + estudio pediátrico) y la psoriasis (casos clínicos de 2009). Otras afecciones inflamatorias (hidradenitis supurativa, vasculopatía livedoide, pioderma gangrenoso) cuentan con informes clínicos en fase inicial pero carecen de ensayos sólidos. La HBOT se posiciona como adyuvante, no de primera línea."

applications:
  - title:
      en: "Chronic Non-Healing Wounds"
      el: "Χρόνιες Μη-Επουλούμενες Πληγές"
      de: "Chronische nicht heilende Wunden"
      it: "Ferite croniche non cicatrizzanti"
      es: "Heridas crónicas que no cicatrizan"
    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "Adjunctive HBOT for chronic non-healing wounds, including diabetic foot ulcers and vascular ulcers. Evidence base for chronic wound healing is the most robust dermatology application of HBOT."
      el: "Επικουρική HBOT για χρόνιες μη-επουλούμενες πληγές, συμπεριλαμβανομένων διαβητικών ελκών ποδιού και αγγειακών ελκών. Η τεκμηρίωση για επούλωση χρόνιων πληγών είναι η πιο ισχυρή εφαρμογή της HBOT στη δερματολογία."
      de: "Adjuvante HBOT bei chronischen nicht heilenden Wunden, einschließlich diabetischer Fußulzera und vaskulärer Ulzera. Die Evidenzbasis für die Heilung chronischer Wunden ist die robusteste dermatologische HBOT-Anwendung."
      it: "HBOT adiuvante per ferite croniche non cicatrizzanti, comprese le ulcere del piede diabetico e le ulcere vascolari. La base di evidenza per la guarigione delle ferite croniche è l'applicazione dermatologica più solida dell'HBOT."
      es: "HBOT adyuvante para heridas crónicas que no cicatrizan, incluidas las úlceras de pie diabético y las úlceras vasculares. La base de evidencia para la cicatrización de heridas crónicas es la aplicación dermatológica más sólida de la HBOT."

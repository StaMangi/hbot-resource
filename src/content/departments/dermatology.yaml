  - title:
      en: "Radiation Dermatitis & Soft-Tissue Radiation Injury"
      el: "Ακτινική Δερματίτιδα & Ακτινική Βλάβη Μαλακών Ιστών"
      de: "Strahlendermatitis & Strahlenschäden des Weichgewebes"
      it: "Radiodermatite e danno radiogeno dei tessuti molli"
      es: "Radiodermatitis y lesión por radiación de tejidos blandos"
    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "Treatment for radiation dermatitis and delayed soft-tissue healing after radiotherapy. Promotes angiogenesis in hypoxic, hypovascular, hypocellular tissue."
      el: "Θεραπεία για ακτινική δερματίτιδα και καθυστερημένη επούλωση μαλακών ιστών μετά από ακτινοθεραπεία. Προάγει αγγειογένεση σε υποξικό, υποαγγειακό, υποκυτταρικό ιστό."
      de: "Behandlung der Strahlendermatitis und der verzögerten Weichgewebeheilung nach Strahlentherapie. Fördert die Angiogenese in hypoxischem, hypovaskulärem, hypozellulärem Gewebe."
      it: "Trattamento della radiodermatite e della guarigione ritardata dei tessuti molli dopo radioterapia. Promuove l'angiogenesi nel tessuto ipossico, ipovascolare, ipocellulare."
      es: "Tratamiento de la radiodermatitis y de la cicatrización retardada de los tejidos blandos tras radioterapia. Promueve la angiogénesis en el tejido hipóxico, hipovascular e hipocelular."

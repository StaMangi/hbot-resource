  - title:
      en: "Burns & Necrotizing Soft-Tissue Infection"
      el: "Εγκαύματα & Νεκρωτικές Λοιμώξεις Μαλακών Ιστών"
      de: "Verbrennungen & nekrotisierende Weichgewebeinfektion"
      it: "Ustioni e infezione necrotizzante dei tessuti molli"
      es: "Quemaduras e infección necrosante de tejidos blandos"
    type: "FDA-Approved"
    typeColor: "green"
    description:
      en: "Adjunctive treatment for necrotizing fasciitis, Fournier's gangrene, and severe burns. Reduces mortality and tissue loss when combined with surgical debridement and antibiotic therapy."
      el: "Επικουρική θεραπεία για νεκρωτική περιτονίτιδα, γάγγραινα Fournier και σοβαρά εγκαύματα. Μειώνει τη θνησιμότητα και την απώλεια ιστών σε συνδυασμό με χειρουργικό καθαρισμό και αντιβιοτική αγωγή."
      de: "Adjuvante Behandlung bei nekrotisierender Fasziitis, Fournier-Gangrän und schweren Verbrennungen. Reduziert Sterblichkeit und Gewebeverlust in Kombination mit chirurgischem Débridement und Antibiotikatherapie."
      it: "Trattamento adiuvante per fascite necrotizzante, gangrena di Fournier e ustioni gravi. Riduce la mortalità e la perdita di tessuto se associato a debridement chirurgico e terapia antibiotica."
      es: "Tratamiento adyuvante para la fascitis necrosante, la gangrena de Fournier y las quemaduras graves. Reduce la mortalidad y la pérdida de tejido cuando se combina con el desbridamiento quirúrgico y la antibioticoterapia."

legacyId: 7
title:
  en: "HBOT improves symptoms, brain microstructure and functionality in veterans with treatment-resistant PTSD"
  el: "Η HBOT βελτιώνει συμπτώματα, μικροδομή εγκεφάλου και λειτουργικότητα σε βετεράνους με ανθεκτική ΔΜΤΣ"
  de: "HBOT verbessert Symptome, Hirn-Mikrostruktur und Funktionalität bei Veteranen mit therapieresistenter PTBS"
  it: "La HBOT migliora i sintomi, la microstruttura cerebrale e la funzionalità nei veterani con disturbo post-traumatico da stress (PTSD) resistente al trattamento"
  es: "La HBOT mejora los síntomas, la microestructura cerebral y la funcionalidad en veteranos con trastorno de estrés postraumático (TEPT) resistente al tratamiento"
authors: "Doenyas-Barak K, Catalogna M, Kutz I, et al."
journal: "PLoS One"
year: 2022
type: "Prospective Clinical Study"
evidenceLevel: "Level II"
keyFinding:
  en: "HBOT significantly improved PTSD checklist scores and demonstrated measurable improvements in brain microstructure on advanced MRI in treatment-resistant PTSD veterans."
  el: "Η HBOT βελτίωσε σημαντικά τις βαθμολογίες ελέγχου ΔΜΤΣ και απέδειξε μετρήσιμες βελτιώσεις στη μικροδομή εγκεφάλου σε προηγμένη MRI σε βετεράνους με ανθεκτική ΔΜΤΣ."
  de: "HBOT verbesserte die PTBS-Checklisten-Scores signifikant und zeigte in der fortgeschrittenen MRT messbare Verbesserungen der Hirn-Mikrostruktur bei Veteranen mit therapieresistenter PTBS."
  it: "La HBOT ha migliorato significativamente i punteggi della checklist per il PTSD e ha dimostrato miglioramenti misurabili della microstruttura cerebrale alla RM avanzata in veterani con PTSD resistente al trattamento."
  es: "La HBOT mejoró significativamente las puntuaciones de la lista de verificación del TEPT y demostró mejoras mensurables de la microestructura cerebral en la RM avanzada en veteranos con TEPT resistente al tratamiento."
doi: "https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0261350"
ref: "[20]"

legacyId: 1
title:
  en: "Hyperbaric oxygen therapy increases telomere length and decreases immunosenescence in isolated blood cells"
  el: "Η θεραπεία με υπερβαρικό οξυγόνο αυξάνει το μήκος τελομερών και μειώνει την ανοσοεπιγήρανση σε απομονωμένα αιμοσφαίρια"
  de: "Die hyperbare Sauerstofftherapie verlängert die Telomere und reduziert die Immunseneszenz in isolierten Blutzellen"
  it: "L'ossigenoterapia iperbarica aumenta la lunghezza dei telomeri e riduce l'immunosenescenza in cellule ematiche isolate"
  es: "La oxigenoterapia hiperbárica aumenta la longitud de los telómeros y disminuye la inmunosenescencia en células sanguíneas aisladas"
  fr: "L'oxygénothérapie hyperbare augmente la longueur des télomères et diminue l'immunosénescence dans des cellules sanguines isolées"
authors: "Hachmo Y, Hadanny A, Abu Hamed R, et al."
journal: "Aging (Albany NY)"
year: 2020
type: "Prospective Clinical Study"
evidenceLevel: "Level II"
keyFinding:
  en: "60 HBOT sessions increased PBMC telomere length by >20% and significantly reduced senescent T-cells — first human evidence of non-pharmacological telomere lengthening."
  el: "60 συνεδρίες HBOT αύξησαν το μήκος τελομερών PBMC κατά >20% και μείωσαν σημαντικά τα γηρασμένα T-κύτταρα — πρώτη ανθρώπινη απόδειξη μη φαρμακολογικής επιμήκυνσης τελομερών."
  de: "60 HBOT-Sitzungen verlängerten die PBMC-Telomere um >20 % und reduzierten seneszente T-Zellen signifikant — der erste menschliche Nachweis einer nicht-pharmakologischen Telomerverlängerung."
  it: "60 sedute di HBOT hanno aumentato la lunghezza dei telomeri delle PBMC di >20% e ridotto significativamente i linfociti T senescenti — prima evidenza nell'uomo di un allungamento dei telomeri non farmacologico."
  es: "60 sesiones de HBOT aumentaron la longitud de los telómeros de las PBMC en >20% y redujeron significativamente los linfocitos T senescentes — primera evidencia en humanos de un alargamiento no farmacológico de los telómeros."
  fr: "60 séances d'HBOT ont augmenté la longueur des télomères des PBMC de plus de 20 % et significativement réduit les lymphocytes T sénescents — premières données chez l'être humain d'un allongement non pharmacologique des télomères."
doi: "https://doi.org/10.18632/aging.202188"
ref: "[3]"

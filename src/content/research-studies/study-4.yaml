title:
  en: "Physical enhancement of older adults using hyperbaric oxygen: a randomized controlled trial"
  el: "Φυσική ενίσχυση ηλικιωμένων με υπερβαρικό οξυγόνο: τυχαιοποιημένη ελεγχόμενη μελέτη"
  de: "Körperliche Förderung älterer Erwachsener mittels hyperbarem Sauerstoff: eine randomisierte kontrollierte Studie"
authors: "Hadanny A, Sasson E, Copel L, et al."
journal: "BMC Geriatrics"
year: 2024
type: "Randomized Controlled Trial"
evidenceLevel: "Level I"
keyFinding:
  en: "HBOT improved maximal physical performance and cardiac perfusion in sedentary older adults, including enhanced VO2 max and cardiovascular function."
  el: "Η HBOT βελτίωσε τη μέγιστη φυσική απόδοση και καρδιακή αιμάτωση σε καθιστικούς ηλικιωμένους, συμπεριλαμβανομένης ενισχυμένης VO2 max και καρδιαγγειακής λειτουργίας."
  de: "HBOT verbesserte die maximale körperliche Leistungsfähigkeit und die kardiale Perfusion bei sitzend lebenden älteren Erwachsenen, einschließlich erhöhter VO2max und kardiovaskulärer Funktion."
doi: "https://link.springer.com/article/10.1186/s12877-024-05146-3"
ref: "[21]"

legacyId: 5
title:
  en: "Hyperbaric oxygen therapy in inflammatory bowel disease: a systematic review and meta-analysis"
  el: "Θεραπεία με υπερβαρικό οξυγόνο στη φλεγμονώδη νόσο εντέρου: συστηματική ανασκόπηση και μετα-ανάλυση"
  de: "Hyperbare Sauerstofftherapie bei chronisch-entzündlicher Darmerkrankung: eine systematische Übersichtsarbeit und Meta-Analyse"
  it: "Ossigenoterapia iperbarica nella malattia infiammatoria intestinale: revisione sistematica e metanalisi"
  es: "Oxigenoterapia hiperbárica en la enfermedad inflamatoria intestinal: revisión sistemática y metaanálisis"
authors: "Singh AK, Jha DK, Jena A, et al."
journal: "European Journal of Gastroenterology & Hepatology"
year: 2021
type: "Systematic Review & Meta-Analysis"
evidenceLevel: "Level I (Meta-Analysis)"
keyFinding:
  en: "HBOT achieved response rates exceeding 80% in both ulcerative colitis and Crohn's disease, with significant mucosal healing demonstrated."
  el: "Η HBOT επέτυχε ποσοστά ανταπόκρισης >80% τόσο στην ελκώδη κολίτιδα όσο και στη νόσο Crohn, με αποδεδειγμένη σημαντική επούλωση βλεννογόνου."
  de: "HBOT erreichte sowohl bei Colitis ulcerosa als auch bei Morbus Crohn Ansprechraten von über 80 %, mit nachgewiesener signifikanter Schleimhautheilung."
  it: "La HBOT ha ottenuto tassi di risposta superiori all'80% sia nella colite ulcerosa sia nella malattia di Crohn, con una significativa guarigione della mucosa dimostrata."
  es: "La HBOT logró tasas de respuesta superiores al 80% tanto en la colitis ulcerosa como en la enfermedad de Crohn, con una cicatrización mucosa significativa demostrada."
doi: "https://pubmed.ncbi.nlm.nih.gov/33156066/"

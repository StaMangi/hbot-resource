  de: "Evidenz Stufe B zur Unterstützung von HBOT bei leichtem SHT und postkommotionellem Syndrom, mit Verbesserungen neurokognitiver Defizite und postkommotioneller Symptome."
  it: "Evidenza di livello B a sostegno della HBOT nel trauma cranico lieve e nella sindrome post-commozione cerebrale, con miglioramenti dei deficit neurocognitivi e dei sintomi post-commozione cerebrale."

name:
  en: "Intensive Care Unit (ICU)"
  el: "Μονάδα Εντατικής Θεραπείας (ΜΕΘ)"
  de: "Intensivstation (ITS)"
  it: "Unità di Terapia Intensiva (UTI)"
  es: "Unidad de Cuidados Intensivos (UCI)"
icon: "Monitor"
rationale:
  en: "While critically ill patients may occasionally require HBOT for conditions such as gas gangrene or carbon monoxide poisoning, the logistical challenges of managing ventilated, hemodynamically unstable patients in a hyperbaric chamber are significant. Standard ICU monitoring equipment is not compatible with hyperbaric environments. Monoplace chambers limit access for emergency interventions."
  el: "Ενώ κρίσιμα ασθενείς μπορεί περιστασιακά να χρειαστούν HBOT για παθήσεις όπως αέρια γάγγραινα ή δηλητηρίαση από μονοξείδιο άνθρακα, οι λογιστικές προκλήσεις διαχείρισης διασωληνωμένων, αιμοδυναμικά ασταθών ασθενών σε υπερβαρικό θάλαμο είναι σημαντικές. Ο τυπικός εξοπλισμός παρακολούθησης ΜΕΘ δεν είναι συμβατός με υπερβαρικά περιβάλλοντα."
  de: "Kritisch kranke Patient:innen benötigen gelegentlich HBOT bei Erkrankungen wie Gasbrand oder Kohlenmonoxidvergiftung, doch sind die logistischen Herausforderungen der Versorgung beatmeter, hämodynamisch instabiler Patient:innen in einer Druckkammer erheblich. Standard-Monitoringgeräte der ITS sind mit hyperbaren Umgebungen nicht kompatibel. Einplatzkammern schränken den Zugang für Notfallinterventionen ein."
  it: "Sebbene i pazienti in condizioni critiche possano occasionalmente necessitare di HBOT per patologie come la gangrena gassosa o l'avvelenamento da monossido di carbonio, le sfide logistiche nella gestione di pazienti ventilati ed emodinamicamente instabili in una camera iperbarica sono notevoli. Le apparecchiature standard di monitoraggio della terapia intensiva non sono compatibili con gli ambienti iperbarici. Le camere monoposto limitano l'accesso per gli interventi d'emergenza."
  es: "Aunque los pacientes en estado crítico pueden necesitar ocasionalmente HBOT para patologías como la gangrena gaseosa o la intoxicación por monóxido de carbono, los retos logísticos del manejo de pacientes ventilados y hemodinámicamente inestables en una cámara hiperbárica son considerables. El equipo estándar de monitorización de la UCI no es compatible con los entornos hiperbáricos. Las cámaras monoplaza limitan el acceso para las intervenciones de urgencia."
role:
  en: "Occasional referral for specific indications (CO poisoning, gas gangrene)"
  el: "Περιστασιακή παραπομπή για συγκεκριμένες ενδείξεις (δηλητηρίαση CO, αέρια γάγγραινα)"
  de: "Gelegentliche Zuweisung bei spezifischen Indikationen (CO-Vergiftung, Gasbrand)"
  it: "Invio occasionale per indicazioni specifiche (avvelenamento da CO, gangrena gassosa)"
  es: "Derivación ocasional para indicaciones específicas (intoxicación por CO, gangrena gaseosa)"

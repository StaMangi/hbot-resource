answerBox:
  en: "Hyperbaric oxygen is studied as a recovery aid for athletes. A systematic review and meta-analysis reported 30–50% faster muscle recovery, reduced exercise-induced muscle damage, lower inflammation markers and improved endurance. The evidence is growing but preliminary; HBOT is an adjunct to, not a replacement for, established recovery practice."
  el: "Η υπερβαρική οξυγονοθεραπεία μελετάται ως βοήθημα αποκατάστασης για αθλητές. Μια συστηματική ανασκόπηση και μετα-ανάλυση ανέφερε 30–50% ταχύτερη μυϊκή αποκατάσταση, μειωμένη ασκησιογενή μυϊκή βλάβη, χαμηλότερους δείκτες φλεγμονής και βελτιωμένη αντοχή. Η τεκμηρίωση αυξάνεται αλλά είναι προκαταρκτική· η HBOT αποτελεί επικουρική θεραπεία και όχι υποκατάστατο της καθιερωμένης πρακτικής αποκατάστασης."
  de: "Hyperbarer Sauerstoff wird als Erholungshilfe für Sportler untersucht. Eine systematische Übersicht und Metaanalyse berichtete eine 30–50 % schnellere Muskelerholung, reduzierte trainingsbedingte Muskelschädigung, niedrigere Entzündungsmarker und verbesserte Ausdauer. Die Evidenz wächst, ist aber vorläufig; HBOT ist ein Adjuvans zu, nicht ein Ersatz für etablierte Erholungspraktiken."
  it: "L'ossigeno iperbarico è studiato come ausilio al recupero per atleti. Una revisione sistematica con metanalisi ha riportato un recupero muscolare più rapido del 30–50%, riduzione del danno muscolare indotto dall'esercizio, marcatori infiammatori più bassi e migliorata resistenza. L'evidenza è in crescita ma preliminare; l'HBOT è un adiuvante e non un sostituto delle pratiche di recupero consolidate."
  es: "El oxígeno hiperbárico se estudia como ayuda a la recuperación para deportistas. Una revisión sistemática con metaanálisis informó una recuperación muscular un 30–50% más rápida, reducción del daño muscular inducido por el ejercicio, menores marcadores de inflamación y mejora de la resistencia. La evidencia está creciendo pero es preliminar; la HBOT es un adyuvante, no un sustituto, de las prácticas de recuperación establecidas."

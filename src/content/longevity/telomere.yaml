answerBox:
  en: "Telomeres are protective caps on chromosomes that shorten with age. A landmark 2020 study in healthy older adults reported over 20% lengthening of immune-cell telomeres after 60 hyperbaric oxygen sessions — the first human evidence that a therapy could lengthen telomeres. The finding is early and an area of active research."
  el: "Τα τελομερή είναι προστατευτικά «καπάκια» στα χρωμοσώματα που βραχύνονται με την ηλικία. Μια μελέτη-ορόσημο του 2020 σε υγιείς ηλικιωμένους ενήλικες ανέφερε επιμήκυνση των τελομερών των ανοσοκυττάρων κατά πάνω από 20% μετά από 60 συνεδρίες υπερβαρικού οξυγόνου — η πρώτη ανθρώπινη απόδειξη ότι μια θεραπεία μπορεί να επιμηκύνει τα τελομερή. Το εύρημα είναι πρώιμο και πεδίο ενεργού έρευνας."
  de: "Telomere sind schützende Kappen an den Chromosomen, die mit dem Alter kürzer werden. Eine richtungsweisende Studie von 2020 bei gesunden älteren Erwachsenen berichtete eine Verlängerung der Immunzell-Telomere um mehr als 20 % nach 60 Sitzungen hyperbaren Sauerstoffs — der erste menschliche Nachweis, dass eine Therapie Telomere verlängern kann. Das Ergebnis ist früh und ein Feld aktiver Forschung."
  it: "I telomeri sono cappucci protettivi dei cromosomi che si accorciano con l'età. Uno studio storico del 2020 in adulti più anziani sani ha riportato un allungamento di oltre il 20% dei telomeri delle cellule immunitarie dopo 60 sedute di ossigeno iperbarico — la prima evidenza nell'uomo che una terapia possa allungare i telomeri. Si tratta di un risultato precoce e di un'area di ricerca attiva."
  es: "Los telómeros son cápsulas protectoras de los cromosomas que se acortan con la edad. Un estudio de referencia de 2020 en adultos mayores sanos informó un alargamiento superior al 20% de los telómeros de las células inmunitarias tras 60 sesiones de oxígeno hiperbárico — la primera evidencia en humanos de que una terapia puede alargar los telómeros. Se trata de un hallazgo temprano y un área de investigación activa."

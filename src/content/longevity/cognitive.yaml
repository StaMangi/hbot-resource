summary:
  en: "Randomized controlled trial in healthy older adults showed significant cognitive enhancements including memory, processing speed, and executive function improvements correlated with increased cerebral blood flow."
  el: "Τυχαιοποιημένη ελεγχόμενη δοκιμή σε υγιείς ηλικιωμένους έδειξε σημαντικές γνωστικές ενισχύσεις συμπεριλαμβανομένης βελτίωσης μνήμης, ταχύτητας επεξεργασίας και εκτελεστικής λειτουργίας που συσχετίζονται με αυξημένη εγκεφαλική αιματική ροή."
  de: "Eine randomisierte kontrollierte Studie an gesunden älteren Erwachsenen zeigte signifikante kognitive Verbesserungen einschließlich Gedächtnis, Verarbeitungsgeschwindigkeit und Exekutivfunktion, die mit einem erhöhten zerebralen Blutfluss korrelierten."
  it: "Uno studio clinico randomizzato controllato (RCT) in anziani sani ha mostrato miglioramenti cognitivi significativi, tra cui la memoria, la velocità di elaborazione e la funzione esecutiva, correlati a un aumento del flusso ematico cerebrale."
  es: "Un ensayo clínico aleatorizado (ECA) en adultos mayores sanos mostró mejoras cognitivas significativas, incluidas mejoras en la memoria, la velocidad de procesamiento y la función ejecutiva, correlacionadas con un aumento del flujo sanguíneo cerebral."
mechanism:
  en: "HBOT increases regional cerebral blood flow, promotes neuroplasticity through BDNF upregulation, reduces neuroinflammation, and supports hippocampal neurogenesis — all mechanisms diminished with normal aging."
  el: "Η HBOT αυξάνει περιφερειακή εγκεφαλική αιματική ροή, προάγει νευροπλαστικότητα μέσω ανύψωσης BDNF, μειώνει νευροφλεγμονή και υποστηρίζει ιπποκαμπική νευρογένεση — όλοι μηχανισμοί που μειώνονται με την κανονική γήρανση."
  de: "HBOT erhöht den regionalen zerebralen Blutfluss, fördert die Neuroplastizität durch BDNF-Hochregulation, reduziert die Neuroinflammation und unterstützt die hippocampale Neurogenese — allesamt Mechanismen, die mit dem normalen Altern abnehmen."
  it: "L'HBOT aumenta il flusso ematico cerebrale regionale, promuove la neuroplasticità tramite la sovraregolazione del BDNF, riduce la neuroinfiammazione e supporta la neurogenesi ippocampale — tutti meccanismi che diminuiscono con il normale invecchiamento."
  es: "HBOT aumenta el flujo sanguíneo cerebral regional, promueve la neuroplasticidad mediante la sobrerregulación del BDNF, reduce la neuroinflamación y favorece la neurogénesis hipocampal — todos ellos mecanismos que disminuyen con el envejecimiento normal."

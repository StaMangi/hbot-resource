statLabel:
  en: "Elastic-fibre length in skin after 60 sessions (n=13)"
  el: "Μήκος ελαστικών ινών δέρματος μετά από 60 συνεδρίες (n=13)"
  de: "Länge elastischer Hautfasern nach 60 Sitzungen (n=13)"
  it: "Lunghezza delle fibre elastiche cutanee dopo 60 sedute (n=13)"
  es: "Longitud de las fibras elásticas de la piel tras 60 sesiones (n=13)"
  fr: "Longueur des fibres élastiques cutanées après 60 séances (n=13)"
color: "navy"
summary:
  en: "In a small prospective trial in 13 healthy older men, 60 HBOT sessions increased collagen density and elastic-fibre length and reduced senescent cells in skin biopsies. In a rat wound model, HBOT increased collagen III formation. Evidence in people rests on this single small study from one research group."
  el: "Σε μια μικρή προοπτική δοκιμή σε 13 υγιείς ηλικιωμένους άνδρες, 60 συνεδρίες HBOT αύξησαν την πυκνότητα κολλαγόνου και το μήκος των ελαστικών ινών και μείωσαν τα γηρασμένα κύτταρα σε βιοψίες δέρματος. Σε πειραματικό μοντέλο τραύματος σε αρουραίους, η HBOT αύξησε τον σχηματισμό κολλαγόνου τύπου III. Τα στοιχεία στον άνθρωπο βασίζονται σε αυτή τη μοναδική μικρή μελέτη μίας ερευνητικής ομάδας."
  de: "In einer kleinen prospektiven Studie an 13 gesunden älteren Männern erhöhten 60 HBOT-Sitzungen die Kollagendichte und die Länge der elastischen Fasern und verringerten seneszente Zellen in Hautbiopsien. In einem Wundmodell an Ratten steigerte HBOT die Bildung von Kollagen Typ III. Die Evidenz beim Menschen beruht auf dieser einen kleinen Studie einer einzigen Forschungsgruppe."
  it: "In un piccolo studio prospettico su 13 uomini anziani sani, 60 sedute di HBOT hanno aumentato la densità del collagene e la lunghezza delle fibre elastiche e ridotto le cellule senescenti nelle biopsie cutanee. In un modello di ferita nel ratto, l'HBOT ha aumentato la formazione di collagene di tipo III. Le evidenze nell'uomo si basano su quest'unico piccolo studio di un solo gruppo di ricerca."
  es: "En un pequeño ensayo prospectivo en 13 hombres mayores sanos, 60 sesiones de HBOT aumentaron la densidad de colágeno y la longitud de las fibras elásticas y redujeron las células senescentes en biopsias de piel. En un modelo de herida en ratas, la HBOT aumentó la formación de colágeno tipo III. La evidencia en humanos se basa en este único estudio pequeño de un solo grupo de investigación."
  fr: "Dans un petit essai prospectif mené chez 13 hommes âgés en bonne santé, 60 séances d'HBOT ont augmenté la densité du collagène et la longueur des fibres élastiques et réduit les cellules sénescentes dans des biopsies cutanées. Dans un modèle de plaie chez le rat, l'HBOT a augmenté la formation de collagène III. Chez l'être humain, les données reposent sur cette seule petite étude issue d'un seul groupe de recherche."
mechanism:
  en: "The skin-ageing trial attributed the changes to new blood-vessel formation and clearance of senescent cells in the dermis; elastic-fibre density and thickness did not change. In the rat study, HBOT raised collagen III in healing wounds but did not reduce wound size. Effects on joints or other connective tissue have not been studied."
  el: "Η δοκιμή για τη γήρανση του δέρματος απέδωσε τις μεταβολές στον σχηματισμό νέων αιμοφόρων αγγείων και στην απομάκρυνση γηρασμένων κυττάρων στο χόριο· η πυκνότητα και το πάχος των ελαστικών ινών δεν μεταβλήθηκαν. Στη μελέτη σε αρουραίους, η HBOT αύξησε το κολλαγόνο τύπου III στα τραύματα που επουλώνονταν, αλλά δεν μείωσε το μέγεθος του τραύματος. Οι επιδράσεις στις αρθρώσεις ή σε άλλους συνδετικούς ιστούς δεν έχουν μελετηθεί."
  de: "Die Hautalterungsstudie führte die Veränderungen auf die Bildung neuer Blutgefäße und den Abbau seneszenter Zellen in der Dermis zurück; Dichte und Dicke der elastischen Fasern änderten sich nicht. In der Rattenstudie erhöhte HBOT das Kollagen Typ III in heilenden Wunden, verkleinerte die Wunden aber nicht. Wirkungen auf Gelenke oder anderes Bindegewebe wurden nicht untersucht."
  it: "Lo studio sull'invecchiamento cutaneo ha attribuito i cambiamenti alla formazione di nuovi vasi sanguigni e all'eliminazione delle cellule senescenti nel derma; densità e spessore delle fibre elastiche non sono cambiati. Nello studio sul ratto, l'HBOT ha aumentato il collagene di tipo III nelle ferite in guarigione, ma non ne ha ridotto le dimensioni. Gli effetti su articolazioni o altri tessuti connettivi non sono stati studiati."
  es: "El ensayo sobre envejecimiento cutáneo atribuyó los cambios a la formación de nuevos vasos sanguíneos y a la eliminación de células senescentes en la dermis; la densidad y el grosor de las fibras elásticas no cambiaron. En el estudio en ratas, la HBOT aumentó el colágeno tipo III en las heridas en cicatrización, pero no redujo su tamaño. No se han estudiado los efectos sobre las articulaciones ni otros tejidos conjuntivos."
  fr: "L'essai sur le vieillissement cutané a attribué ces changements à la formation de nouveaux vaisseaux sanguins et à l'élimination des cellules sénescentes dans le derme ; la densité et l'épaisseur des fibres élastiques n'ont pas changé. Dans l'étude chez le rat, l'HBOT a augmenté le collagène III dans les plaies en cours de cicatrisation, mais n'a pas réduit la taille des plaies. Les effets sur les articulations ou d'autres tissus conjonctifs n'ont pas été étudiés."

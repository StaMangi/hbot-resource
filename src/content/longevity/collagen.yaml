answerBox:
  en: "Hyperbaric oxygen has been studied for its effects on ageing skin. A small trial in 13 older men reported increased collagen density and longer elastic fibres in skin biopsies after 60 sessions, and a rat study found more collagen III in healing wounds. The human evidence rests on one small study from a single group; this is research, not an established cosmetic treatment."
  el: "Το υπερβαρικό οξυγόνο έχει μελετηθεί για τις επιδράσεις του στη γήρανση του δέρματος. Μια μικρή δοκιμή σε 13 ηλικιωμένους άνδρες ανέφερε αυξημένη πυκνότητα κολλαγόνου και μακρύτερες ελαστικές ίνες σε βιοψίες δέρματος μετά από 60 συνεδρίες, και μια μελέτη σε αρουραίους βρήκε περισσότερο κολλαγόνο τύπου III σε τραύματα υπό επούλωση. Τα στοιχεία στον άνθρωπο βασίζονται σε μία μικρή μελέτη μίας ομάδας· πρόκειται για έρευνα, όχι για καθιερωμένη αισθητική θεραπεία."
  de: "Hyperbarer Sauerstoff wurde auf seine Wirkung auf alternde Haut untersucht. Eine kleine Studie an 13 älteren Männern berichtete nach 60 Sitzungen über eine höhere Kollagendichte und längere elastische Fasern in Hautbiopsien, und eine Rattenstudie fand mehr Kollagen Typ III in heilenden Wunden. Die Evidenz beim Menschen beruht auf einer kleinen Studie einer einzigen Gruppe; es handelt sich um Forschung, nicht um eine etablierte kosmetische Behandlung."
  it: "L'ossigeno iperbarico è stato studiato per i suoi effetti sull'invecchiamento cutaneo. Un piccolo studio su 13 uomini anziani ha riportato una maggiore densità del collagene e fibre elastiche più lunghe nelle biopsie cutanee dopo 60 sedute, e uno studio sul ratto ha rilevato più collagene di tipo III nelle ferite in guarigione. Le evidenze nell'uomo si basano su un piccolo studio di un solo gruppo; si tratta di ricerca, non di un trattamento estetico consolidato."
  es: "El oxígeno hiperbárico se ha estudiado por sus efectos sobre el envejecimiento de la piel. Un pequeño ensayo en 13 hombres mayores notificó mayor densidad de colágeno y fibras elásticas más largas en biopsias de piel tras 60 sesiones, y un estudio en ratas halló más colágeno tipo III en heridas en cicatrización. La evidencia en humanos se basa en un único estudio pequeño de un solo grupo; se trata de investigación, no de un tratamiento estético establecido."
  fr: "L'oxygène hyperbare a été étudié pour ses effets sur le vieillissement de la peau. Un petit essai mené chez 13 hommes âgés a rapporté une densité de collagène accrue et des fibres élastiques plus longues dans des biopsies cutanées après 60 séances, et une étude chez le rat a observé davantage de collagène III dans des plaies en cours de cicatrisation. Chez l'être humain, les données reposent sur une seule petite étude issue d'un seul groupe ; il s'agit de recherche, et non d'un traitement esthétique établi."

title:
  en: "Gas Volume Reduction"
  el: "Μείωση Όγκου Αερίου"
  de: "Gasvolumen-Reduktion"
  it: "Riduzione del volume gassoso"
  es: "Reducción del volumen gaseoso"
icon: "Minimize2"
color: "navy"
summary:
  en: "According to Boyle's Law, increased pressure reduces the volume of gas bubbles in the blood — the primary mechanism for decompression sickness and arterial gas embolism."
  el: "Σύμφωνα με τον Νόμο του Boyle, η αυξημένη πίεση μειώνει τον όγκο των φυσαλίδων αερίου στο αίμα — ο κύριος μηχανισμός για τη νόσο αποσυμπίεσης και αρτηριακή αεροεμβολή."
  de: "Nach dem Boyle-Gesetz reduziert ein erhöhter Druck das Volumen von Gasblasen im Blut — der primäre Mechanismus bei Dekompressionskrankheit und arterieller Gasembolie."
  it: "Secondo la legge di Boyle, l'aumento della pressione riduce il volume delle bolle di gas nel sangue — il meccanismo primario per la malattia da decompressione e l'embolia gassosa arteriosa."
  es: "Según la ley de Boyle, el aumento de la presión reduce el volumen de las burbujas de gas en la sangre — el mecanismo primario en la enfermedad por descompresión y la embolia gaseosa arterial."
detail:
  en: "At 2.8 ATA, gas bubble volume is reduced by approximately 64% compared to atmospheric pressure. This physical compression, combined with nitrogen washout through breathing 100% oxygen, eliminates intravascular and intratissue gas bubbles."
  el: "Στα 2,8 ATA, ο όγκος φυσαλίδων αερίου μειώνεται κατά ~64% σε σχέση με την ατμοσφαιρική πίεση. Αυτή η φυσική συμπίεση, σε συνδυασμό με έκπλυση αζώτου μέσω αναπνοής 100% οξυγόνου, εξαλείφει ενδοαγγειακές και ενδοϊστικές φυσαλίδες αερίου."
  de: "Bei 2,8 ATA verringert sich das Gasblasenvolumen gegenüber dem Atmosphärendruck um etwa 64 %. Diese physikalische Kompression beseitigt zusammen mit der Stickstoff-Auswaschung durch Atmung von 100 % Sauerstoff intravaskuläre und intragewebliche Gasblasen."
  it: "A 2,8 ATA il volume delle bolle di gas è ridotto di circa il 64% rispetto alla pressione atmosferica. Questa compressione fisica, associata alla rimozione dell'azoto mediante respirazione di ossigeno al 100%, elimina le bolle di gas intravascolari e intratissutali."
  es: "A 2.8 ATA, el volumen de las burbujas de gas se reduce aproximadamente un 64% respecto a la presión atmosférica. Esta compresión física, combinada con el lavado de nitrógeno mediante la respiración de oxígeno al 100%, elimina las burbujas de gas intravasculares e intratisulares."

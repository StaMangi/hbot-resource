title:
  en: "Antimicrobial Activity"
  el: "Αντιμικροβιακή Δράση"
  de: "Antimikrobielle Wirkung"
  it: "Attività antimicrobica"
  es: "Actividad antimicrobiana"
icon: "Shield"
color: "teal"
summary:
  en: "High oxygen tensions enhance leukocyte oxidative killing capacity and are directly lethal to anaerobic bacteria such as Clostridium perfringens."
  el: "Οι υψηλές τάσεις οξυγόνου ενισχύουν την οξειδωτική ικανότητα θανάτωσης λευκοκυττάρων και είναι άμεσα θανατηφόρες για αναερόβια βακτήρια όπως το Clostridium perfringens."
  de: "Hohe Sauerstoffspannungen verstärken die oxidative Abtötungskapazität der Leukozyten und sind für anaerobe Bakterien wie Clostridium perfringens unmittelbar tödlich."
  it: "Le elevate tensioni di ossigeno potenziano la capacità ossidativa di uccisione dei leucociti e sono direttamente letali per i batteri anaerobi come Clostridium perfringens."
  es: "Las elevadas tensiones de oxígeno potencian la capacidad oxidativa de destrucción de los leucocitos y son directamente letales para bacterias anaerobias como Clostridium perfringens."
detail:
  en: "Oxygen is utilized by neutrophils and macrophages to generate reactive oxygen species (ROS) that destroy bacteria. HBOT is directly bactericidal to obligate anaerobes and enhances the efficacy of certain antibiotics, particularly aminoglycosides."
  el: "Το οξυγόνο χρησιμοποιείται από ουδετερόφιλα και μακροφάγα για παραγωγή δραστικών ειδών οξυγόνου (ROS) που καταστρέφουν βακτήρια. Η HBOT είναι άμεσα βακτηριοκτόνος για υποχρεωτικά αναερόβια και ενισχύει την αποτελεσματικότητα ορισμένων αντιβιοτικών, ιδίως αμινογλυκοσιδών."
  de: "Sauerstoff wird von Neutrophilen und Makrophagen zur Erzeugung reaktiver Sauerstoffspezies (ROS) genutzt, welche Bakterien zerstören. HBOT ist gegenüber obligat anaeroben Erregern unmittelbar bakterizid und verstärkt die Wirksamkeit bestimmter Antibiotika, insbesondere der Aminoglykoside."
  it: "L'ossigeno è utilizzato dai neutrofili e dai macrofagi per generare specie reattive dell'ossigeno (ROS) che distruggono i batteri. L'HBOT è direttamente battericida verso gli anaerobi obbligati e potenzia l'efficacia di alcuni antibiotici, in particolare degli aminoglicosidi."
  es: "El oxígeno es utilizado por los neutrófilos y los macrófagos para generar especies reactivas de oxígeno (ROS) que destruyen las bacterias. HBOT es directamente bactericida frente a los anaerobios obligados y potencia la eficacia de ciertos antibióticos, en particular los aminoglucósidos."

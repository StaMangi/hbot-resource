title:
  en: "Clinical Integration Protocols"
  el: "Πρωτόκολλα Κλινικής Ενσωμάτωσης"
  de: "Protokolle der klinischen Integration"
  it: "Protocolli di integrazione clinica"
  es: "Protocolos de integración clínica"
icon: "ClipboardList"
priority: "High"
description:
  en: "Develop standardized referral pathways from Surgery, Internal Medicine, Oncology, and Geriatric departments for FDA-approved indications. Establish transcutaneous oximetry screening for wound care patients."
  el: "Ανάπτυξη τυποποιημένων διαδρομών παραπομπής από Χειρουργική, Παθολογική, Ογκολογία και Γηριατρικά τμήματα για εγκεκριμένες ενδείξεις FDA. Καθιέρωση διαδερμικής οξυμετρίας για ασθενείς φροντίδας τραυμάτων."
  de: "Entwicklung standardisierter Zuweisungspfade von den Abteilungen Chirurgie, Innere Medizin, Onkologie und Geriatrie für FDA-zugelassene Indikationen. Etablierung eines transkutanen Oxymetrie-Screenings für Wundpatient:innen."
  it: "Sviluppare percorsi di invio standardizzati dai reparti di Chirurgia, Medicina interna, Oncologia e Geriatria per le indicazioni approvate dalla FDA. Istituire lo screening con ossimetria transcutanea per i pazienti con cura delle ferite."
  es: "Desarrollar vías de derivación estandarizadas desde los servicios de Cirugía, Medicina interna, Oncología y Geriatría para las indicaciones aprobadas por la FDA. Establecer el cribado mediante oximetría transcutánea para los pacientes con cuidado de heridas."
